<svg viewBox="0 0 760 366" xmlns="http://www.w3.org/2000/svg">
  <title>컨테이너는 커널 객체가 아니라 네임스페이스, cgroup, 권한 제한 세 가지를 유저 공간의 런타임이 조합한 것이며, 커널에 남는 것은 포인터 몇 개가 다른 평범한 태스크다</title>

  <rect class="box gray" x="20" y="14" width="720" height="44" rx="10"/>
  <text class="t-b" x="36" y="41">컨테이너 런타임</text>
  <text class="t-s end" x="724" y="41">유저 공간의 프로그램. "컨테이너"라는 묶음은 여기에만 있다</text>
  <path class="ln blue" d="M134 58 V84" marker-end="url(#ah-blue)"/>
  <path class="ln green" d="M380 58 V84" marker-end="url(#ah-green)"/>
  <path class="ln warm" d="M626 58 V84" marker-end="url(#ah-warm)"/>

  <rect class="panel blue" x="20" y="88" width="228" height="170" rx="14"/>
  <use href="#i-eye" x="36" y="102" width="36" height="36" class="ic blue"/>
  <text class="t-l" x="84" y="118">네임스페이스</text>
  <text class="t-s" x="84" y="138">무엇이 보이는가</text>
  <text class="t-code" x="36" y="172">mnt · pid · net · uts</text>
  <text class="t-code" x="36" y="192">ipc · user · cgroup · time</text>
  <text class="t-xs" x="36" y="222">PID, 마운트 트리, 네트워크 장치의</text>
  <text class="t-xs" x="36" y="240">이름표를 태스크 묶음마다 따로</text>

  <rect class="panel green" x="266" y="88" width="228" height="170" rx="14"/>
  <use href="#i-scale" x="282" y="102" width="36" height="36" class="ic green"/>
  <text class="t-l" x="330" y="118">cgroup</text>
  <text class="t-s" x="330" y="138">얼마나 쓰는가</text>
  <text class="t-code" x="282" y="172">cpu · memory · io</text>
  <text class="t-code" x="282" y="192">pids · cpuset</text>
  <text class="t-xs" x="282" y="222">태스크를 트리로 묶어</text>
  <text class="t-xs" x="282" y="240">자원을 재고 제한한다</text>

  <rect class="panel warm" x="512" y="88" width="228" height="170" rx="14"/>
  <use href="#i-shield" x="528" y="102" width="36" height="36" class="ic warm"/>
  <text class="t-l" x="576" y="118">권한 제한</text>
  <text class="t-s" x="576" y="138">무엇을 할 수 있는가</text>
  <text class="t-code" x="528" y="172">capability</text>
  <text class="t-code" x="528" y="192">seccomp · LSM</text>
  <text class="t-xs" x="528" y="222">root의 힘을 쪼개 빼고</text>
  <text class="t-xs" x="528" y="240">시스템 콜을 거른다</text>

  <path class="ln blue" d="M134 258 V290" marker-end="url(#ah-blue)"/>
  <path class="ln green" d="M380 258 V290" marker-end="url(#ah-green)"/>
  <path class="ln warm" d="M626 258 V290" marker-end="url(#ah-warm)"/>
  <text class="t-code" x="144" y="280">task-&gt;nsproxy</text>
  <text class="t-code" x="390" y="280">task-&gt;cgroups</text>
  <text class="t-code" x="636" y="280">task-&gt;cred</text>

  <rect class="box yellow" x="20" y="294" width="720" height="56" rx="10"/>
  <text class="t-mono t-b" x="36" y="327">task_struct</text>
  <text class="t-s end" x="724" y="327">커널이 보는 것: 포인터 몇 개가 다른 곳을 가리키는 평범한 태스크</text>
</svg>
