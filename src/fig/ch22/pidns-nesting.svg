<svg viewBox="0 0 760 356" xmlns="http://www.w3.org/2000/svg">
  <title>PID 네임스페이스의 중첩: 컨테이너 안의 nginx는 자기 네임스페이스에서 PID 1이고 호스트 네임스페이스에서 48213이다. struct pid 하나가 numbers 배열에 단계마다의 번호를 담는다</title>

  <!-- level 0 -->
  <rect class="panel gray" x="20" y="14" width="440" height="290" rx="14"/>
  <text class="t-b" x="36" y="38">PID 네임스페이스 · level 0 (호스트)</text>
  <rect class="box" x="36" y="52" width="180" height="34" rx="6"/>
  <text class="t-s t-ink" x="48" y="74">systemd</text>
  <text class="t-code end" x="204" y="74">1</text>
  <rect class="box" x="36" y="92" width="180" height="34" rx="6"/>
  <text class="t-s t-ink" x="48" y="114">containerd-shim</text>
  <text class="t-code end" x="204" y="114">48190</text>
  <text class="t-xs" x="236" y="74">여기서 ps를 치면</text>
  <text class="t-xs" x="236" y="92">아래 두 프로세스가</text>
  <text class="t-xs" x="236" y="110">48213, 48250으로 보인다</text>

  <!-- level 1 -->
  <rect class="panel blue" x="36" y="140" width="408" height="150" rx="12"/>
  <text class="t-b tc-blue" x="52" y="164">PID 네임스페이스 · level 1 (컨테이너)</text>
  <rect class="box blue" x="52" y="178" width="376" height="42" rx="6"/>
  <text class="t-s t-ink t-b" x="64" y="204">nginx</text>
  <text class="t-code" x="130" y="204">안에서 1</text>
  <text class="t-code end" x="416" y="204">밖에서 48213</text>
  <rect class="box blue" x="52" y="228" width="376" height="42" rx="6"/>
  <text class="t-s t-ink t-b" x="64" y="254">worker</text>
  <text class="t-code" x="130" y="254">안에서 7</text>
  <text class="t-code end" x="416" y="254">밖에서 48250</text>

  <!-- struct pid -->
  <rect class="box yellow" x="500" y="14" width="240" height="196" rx="10"/>
  <text class="t-mono t-b" x="514" y="38">struct pid</text>
  <text class="t-xs end" x="728" y="38">nginx의 것</text>
  <text class="t-code" x="514" y="64">level = 1</text>
  <rect class="box gray" x="514" y="78" width="212" height="52" rx="6"/>
  <text class="t-code" x="524" y="98">numbers[0]</text>
  <text class="t-code" x="524" y="118">nr = 48213 · ns = level 0</text>
  <rect class="box blue" x="514" y="138" width="212" height="52" rx="6"/>
  <text class="t-code" x="524" y="158">numbers[1]</text>
  <text class="t-code" x="524" y="178">nr = 1 · ns = level 1</text>
  <path class="ln yellow" d="M428 199 H470 V112 H496" marker-end="url(#ah-yellow)"/>

  <rect class="box" x="500" y="226" width="240" height="78" rx="10"/>
  <text class="t-code" x="514" y="250">pid_nr_ns(pid, ns)</text>
  <text class="t-xs" x="514" y="270">ns가 level 0이면 48213</text>
  <text class="t-xs" x="514" y="288">ns가 level 1이면 1</text>

  <text class="t-s mid" x="380" y="338">번호는 자기 네임스페이스와 그 조상에만 있다. 안에서 본 바깥 프로세스는 번호가 없다</text>
</svg>
