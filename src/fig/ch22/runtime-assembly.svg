<svg viewBox="0 0 760 352" xmlns="http://www.w3.org/2000/svg">
  <title>컨테이너 런타임의 조립 순서 여섯 단계: 네임스페이스를 만들며 clone, 파일시스템 구성과 pivot_root, veth로 네트워크 연결, cgroup 한도, capability와 seccomp로 권한 축소, 마지막으로 execve</title>

  <!-- 1 -->
  <rect class="box blue" x="20" y="14" width="228" height="96" rx="10"/>
  <text class="t-b" x="34" y="38">① 자식을 만든다</text>
  <text class="t-code" x="34" y="62">clone3(CLONE_NEW*,</text>
  <text class="t-code" x="34" y="80">CLONE_INTO_CGROUP)</text>
  <text class="t-xs tc-blue" x="34" y="100">네임스페이스 · cgroup</text>
  <path class="ln" d="M248 62 H262" marker-end="url(#ah)"/>

  <!-- 2 -->
  <rect class="box blue" x="266" y="14" width="228" height="96" rx="10"/>
  <text class="t-b" x="280" y="38">② 파일시스템을 꾸민다</text>
  <text class="t-code" x="280" y="62">mount("overlay", …)</text>
  <text class="t-code" x="280" y="80">pivot_root()</text>
  <text class="t-xs tc-blue" x="280" y="100">마운트 네임스페이스</text>
  <path class="ln" d="M494 62 H508" marker-end="url(#ah)"/>

  <!-- 3 -->
  <rect class="box blue" x="512" y="14" width="228" height="96" rx="10"/>
  <text class="t-b" x="526" y="38">③ 네트워크를 잇는다</text>
  <text class="t-code" x="526" y="62">veth 쌍을 만들어</text>
  <text class="t-code" x="526" y="80">한쪽을 자식의 netns로</text>
  <text class="t-xs tc-blue" x="526" y="100">네트워크 네임스페이스</text>

  <path class="ln" d="M626 110 V128 H134 V142" marker-end="url(#ah)"/>

  <!-- 4 -->
  <rect class="box green" x="20" y="146" width="228" height="96" rx="10"/>
  <text class="t-b" x="34" y="170">④ 한도를 건다</text>
  <text class="t-code" x="34" y="194">cpu.max · memory.max</text>
  <text class="t-code" x="34" y="212">pids.max</text>
  <text class="t-xs tc-green" x="34" y="232">cgroup</text>
  <path class="ln" d="M248 194 H262" marker-end="url(#ah)"/>

  <!-- 5 -->
  <rect class="box warm" x="266" y="146" width="228" height="96" rx="10"/>
  <text class="t-b" x="280" y="170">⑤ 권한을 줄인다</text>
  <text class="t-code" x="280" y="194">capset() · no_new_privs</text>
  <text class="t-code" x="280" y="212">seccomp()</text>
  <text class="t-xs tc-warm" x="280" y="232">되돌릴 수 없으므로 맨 나중에</text>
  <path class="ln" d="M494 194 H508" marker-end="url(#ah)"/>

  <!-- 6 -->
  <rect class="solid" x="512" y="146" width="228" height="96" rx="10"/>
  <text class="t-b t-on" x="526" y="170">⑥ execve()</text>
  <text class="t-s t-on" x="526" y="196">컨테이너의 프로그램이</text>
  <text class="t-s t-on" x="526" y="216">PID 1로 시작한다</text>

  <!-- 남는 것 -->
  <rect class="box yellow" x="20" y="270" width="720" height="66" rx="10"/>
  <text class="t-b" x="34" y="294">커널에 남은 것</text>
  <text class="t-s" x="150" y="294">포인터 넷이 다른 곳을 가리키는 task_struct 하나</text>
  <text class="t-code" x="34" y="320">nsproxy → 새 네임스페이스</text>
  <text class="t-code" x="222" y="320">cgroups → css_set</text>
  <text class="t-code" x="372" y="320">cred → 줄어든 capability</text>
  <text class="t-code" x="574" y="320">seccomp → 필터</text>
</svg>
