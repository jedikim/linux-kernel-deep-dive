<svg viewBox="0 0 760 352" xmlns="http://www.w3.org/2000/svg">
  <title>struct page 배열 위의 폴리오: 연속한 네 프레임 가운데 첫 프레임이 head이고 나머지 tail의 compound_info가 head를 가리킨다. struct folio는 head의 struct page와 같은 메모리를 다른 타입으로 읽는다.</title>

