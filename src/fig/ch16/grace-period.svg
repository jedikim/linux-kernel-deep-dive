<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <title>유예 기간과 정지 상태: 유예 기간은 모든 CPU가 정지 상태를 한 번씩 지날 때 끝나고, 유예 기간보다 먼저 시작한 읽기 구간만 기다린다</title>

  <text class="t-xs tc-purple mid" x="240" y="24">유예 기간 시작</text>
  <text class="t-xs tc-purple mid" x="600" y="24">끝</text>
  <path class="ln thin purple dash" d="M240 30 V232"/>
  <path class="ln thin purple dash" d="M600 30 V232"/>

  <text class="t-s t-ink t-b" x="20" y="64">CPU 0</text>
  <rect class="box blue" x="180" y="44" width="120" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="240" y="64">읽기 구간</text>
  <rect class="solid green" x="340" y="44" width="10" height="30" rx="3"/>
  <rect class="box blue" x="400" y="44" width="90" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="445" y="64">읽기 구간</text>

  <text class="t-s t-ink t-b" x="20" y="108">CPU 1</text>
  <rect class="box gray" x="160" y="88" width="580" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="480" y="108">idle</text>
  <rect class="solid green" x="250" y="88" width="10" height="30" rx="3"/>

  <text class="t-s t-ink t-b" x="20" y="152">CPU 2</text>
  <rect class="box gray" x="160" y="132" width="360" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="420" y="152">유저 모드</text>
  <rect class="solid green" x="300" y="132" width="10" height="30" rx="3"/>
  <rect class="box blue" x="540" y="132" width="140" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="610" y="152">읽기 구간</text>

  <text class="t-s t-ink t-b" x="20" y="196">CPU 3</text>
  <rect class="box blue" x="200" y="176" width="360" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="380" y="196">읽기 구간 · 유예 기간보다 먼저 시작했다</text>
  <rect class="solid green" x="590" y="176" width="10" height="30" rx="3"/>

  <rect class="solid green" x="20" y="246" width="10" height="16" rx="3"/>
  <text class="t-s" x="40" y="259">정지 상태. 그 CPU가 읽기 구간 밖에 있음이 확실한 순간: 컨텍스트 스위치, idle, 유저 모드</text>
  <text class="t-s" x="40" y="283">마지막 CPU가 정지 상태를 지나면 유예 기간이 끝난다. 뒤에 시작한 읽기 구간은 기다리지 않는다</text>
</svg>
