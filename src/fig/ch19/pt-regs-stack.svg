<svg viewBox="0 0 760 404" xmlns="http://www.w3.org/2000/svg">
  <title>syscall 진입 직후의 커널 스택: CPU는 rip와 rflags를 rcx와 r11에 옮기고 뛸 뿐이고, entry_SYSCALL_64가 커널 스택으로 바꾼 뒤 유저 레지스터를 struct pt_regs 배치대로 쌓는다</title>

  <!-- 유저 레지스터 -->
  <rect class="panel blue" x="20" y="36" width="190" height="176" rx="12"/>
  <text class="t-s tc-blue t-b" x="32" y="60">유저 모드 · syscall 직전</text>
  <text class="t-code" x="32" y="86">rax</text>
  <text class="t-xs end" x="198" y="86">번호</text>
  <text class="t-code" x="32" y="106">rdi rsi rdx</text>
  <text class="t-xs end" x="198" y="106">인자 1–3</text>
  <text class="t-code" x="32" y="126">r10 r8 r9</text>
  <text class="t-xs end" x="198" y="126">인자 4–6</text>
  <text class="t-code" x="32" y="146">rip</text>
  <text class="t-xs end" x="198" y="146">다음 명령어</text>
  <text class="t-code" x="32" y="166">rsp</text>
  <text class="t-xs end" x="198" y="166">유저 스택</text>
  <text class="t-code" x="32" y="186">rflags</text>
  <path class="ln" d="M210 100 H236" marker-end="url(#ah)"/>

  <!-- CPU가 하는 일 -->
  <rect class="box gray" x="240" y="36" width="200" height="128" rx="10"/>
  <text class="t-s t-ink t-b" x="252" y="58">① CPU · syscall 명령어</text>
  <text class="t-code" x="252" y="80">rcx ← rip</text>
  <text class="t-code" x="252" y="98">r11 ← rflags</text>
  <text class="t-code" x="252" y="116">rip ← MSR_LSTAR</text>
  <text class="t-xs" x="252" y="136">링 3에서 링 0으로</text>
  <text class="t-xs" x="252" y="152">스택은 바꾸지 않는다</text>
  <path class="ln" d="M340 164 V180" marker-end="url(#ah)"/>

  <!-- 진입 코드가 하는 일 -->
  <rect class="box yellow" x="240" y="184" width="200" height="128" rx="10"/>
  <text class="t-s t-ink t-b" x="252" y="206">② entry_SYSCALL_64</text>
  <text class="t-code" x="252" y="228">swapgs</text>
  <text class="t-code" x="252" y="246">rsp ← 커널 스택</text>
  <text class="t-code" x="252" y="264">pushq … (pt_regs)</text>
  <text class="t-xs" x="252" y="284">레지스터를 0으로 지운다</text>
  <text class="t-code" x="252" y="302">call do_syscall_64</text>
  <path class="ln" d="M440 248 H466" marker-end="url(#ah)"/>

  <!-- 커널 스택 -->
  <text class="t-xs mid" x="555" y="46">높은 주소 · 커널 스택 꼭대기</text>
  <rect class="box gray" x="470" y="56" width="170" height="26"/>
  <text class="t-code mid" x="555" y="74">ss</text>
  <rect class="box gray" x="470" y="82" width="170" height="26"/>
  <text class="t-code mid" x="555" y="100">sp</text>
  <rect class="box gray" x="470" y="108" width="170" height="26"/>
  <text class="t-code mid" x="555" y="126">flags</text>
  <rect class="box gray" x="470" y="134" width="170" height="26"/>
  <text class="t-code mid" x="555" y="152">cs</text>
  <rect class="box gray" x="470" y="160" width="170" height="26"/>
  <text class="t-code mid" x="555" y="178">ip</text>
  <rect class="box warm" x="470" y="186" width="170" height="26"/>
  <text class="t-code t-b mid" x="555" y="204">orig_ax</text>
  <rect class="box yellow" x="470" y="212" width="170" height="26"/>
  <text class="t-code mid" x="555" y="230">di · si · dx</text>
  <rect class="box yellow" x="470" y="238" width="170" height="26"/>
  <text class="t-code mid" x="555" y="256">cx</text>
  <rect class="box yellow" x="470" y="264" width="170" height="26"/>
  <text class="t-code t-b mid" x="555" y="282">ax</text>
  <rect class="box yellow" x="470" y="290" width="170" height="26"/>
  <text class="t-code mid" x="555" y="308">r8 · r9 · r10</text>
  <rect class="box yellow" x="470" y="316" width="170" height="26"/>
  <text class="t-code mid" x="555" y="334">r11</text>
  <rect class="box yellow" x="470" y="342" width="170" height="26"/>
  <text class="t-code mid" x="555" y="360">bx · bp · r12–r15</text>
  <text class="t-code mid" x="555" y="390">↑ rsp = struct pt_regs *</text>

  <!-- 칸 설명 -->
  <text class="t-xs" x="648" y="100">유저의 rsp</text>
  <text class="t-xs" x="648" y="126">r11에 있던 값</text>
  <text class="t-xs" x="648" y="178">rcx에 있던 값</text>
  <text class="t-xs tc-warm" x="648" y="204">시스템 콜 번호</text>
  <text class="t-xs" x="648" y="230">인자 1–3</text>
  <text class="t-xs" x="648" y="282">반환값 자리</text>
  <text class="t-xs" x="648" y="308">인자 5·6·4</text>
</svg>
