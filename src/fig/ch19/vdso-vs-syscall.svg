<svg viewBox="0 0 760 344" xmlns="http://www.w3.org/2000/svg">
  <title>clock_gettime의 두 경로: vDSO 경로는 유저 모드에서 커널이 갱신해 둔 데이터 페이지를 읽어 끝내고, 시스템 콜 경로는 커널에 들어갔다 나온다</title>

  <text class="t-b" x="20" y="26">vDSO 경로 · 유저 모드를 떠나지 않는다</text>
  <rect class="panel blue" x="20" y="36" width="720" height="96" rx="12"/>
  <rect class="box" x="34" y="54" width="150" height="60" rx="8"/>
  <text class="t-s t-ink t-b mid" x="109" y="78">프로그램</text>
  <text class="t-code mid" x="109" y="98">clock_gettime()</text>
  <path class="ln" d="M184 84 H236" marker-end="url(#ah)"/>
  <text class="t-xs mid" x="210" y="74">호출</text>
  <rect class="box" x="240" y="54" width="230" height="60" rx="8"/>
  <text class="t-s t-ink t-b mid" x="355" y="78">vDSO의 코드</text>
  <text class="t-code mid" x="355" y="98">__vdso_clock_gettime()</text>
  <path class="ln" d="M470 84 H526" marker-end="url(#ah)"/>
  <text class="t-xs mid" x="498" y="74">읽기</text>
  <rect class="box yellow" x="530" y="54" width="196" height="60" rx="8"/>
  <text class="t-s t-ink t-b mid" x="628" y="78">데이터 페이지 [vvar]</text>
  <text class="t-xs mid" x="628" y="98">읽기 전용 · 순번으로 보호</text>

  <path class="ln yellow" d="M628 146 V118" marker-end="url(#ah-yellow)"/>
  <rect class="box yellow" x="530" y="146" width="196" height="32" rx="8"/>
  <text class="t-xs t-ink mid" x="628" y="167">커널이 시각 정보를 갱신</text>
  <text class="t-xs" x="34" y="158">TSC는 vDSO 코드가 직접 읽는다. 커널 진입은 없다</text>

  <path class="ln thin muted dash" d="M20 196 H740"/>

  <text class="t-b" x="20" y="224">시스템 콜 경로 · 같은 답을 커널에 들어가서 얻는다</text>
  <rect class="box blue" x="34" y="240" width="150" height="60" rx="8"/>
  <text class="t-s t-ink t-b mid" x="109" y="264">프로그램</text>
  <text class="t-code mid" x="109" y="284">syscall</text>
  <path class="ln" d="M184 262 H256" marker-end="url(#ah)"/>
  <text class="t-xs mid" x="220" y="254">모드 전환</text>

  <rect class="panel yellow" x="260" y="234" width="466" height="72" rx="12"/>
  <rect class="box" x="274" y="248" width="110" height="44" rx="8"/>
  <text class="t-s t-ink t-b mid" x="329" y="267">진입 코드</text>
  <text class="t-xs mid" x="329" y="284">pt_regs · 완화책</text>
  <path class="ln" d="M384 270 H394" marker-end="url(#ah)"/>
  <rect class="box" x="398" y="248" width="186" height="44" rx="8"/>
  <text class="t-code t-b mid" x="491" y="267">sys_clock_gettime()</text>
  <text class="t-xs mid" x="491" y="284">같은 계산</text>
  <path class="ln" d="M584 270 H594" marker-end="url(#ah)"/>
  <rect class="box" x="598" y="248" width="114" height="44" rx="8"/>
  <text class="t-s t-ink t-b mid" x="655" y="267">복귀 코드</text>
  <text class="t-xs mid" x="655" y="284">레지스터 복원</text>
  <path class="ln" d="M655 292 V320 H109 V304" marker-end="url(#ah)"/>
  <text class="t-xs mid" x="380" y="336">모드 전환 두 번, 레지스터 저장과 복원, 진입마다 도는 완화책</text>
</svg>
