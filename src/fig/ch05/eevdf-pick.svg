<svg viewBox="0 0 760 296" xmlns="http://www.w3.org/2000/svg">
  <title>EEVDF의 선택 예: V가 1일 때 A는 vruntime 1.5로 자격이 없고, B와 C는 자격이 있다. 그 가운데 가상 데드라인이 2로 더 이른 C가 뽑힌다.</title>

  <!-- 축: 0은 x=150, 1 = 140px -->
  <path class="ln thick purple" d="M290 30 V212"/>
  <text class="t-b tc-purple" x="298" y="24">V = 1</text>
  <text class="t-xs" x="352" y="24">이 선의 왼쪽에서 시작하는 태스크만 후보</text>

  <text class="t-b" x="20" y="64">A</text>
  <text class="t-xs" x="38" y="64">가중치 2 · 3ms</text>
  <rect class="box gray" x="360" y="44" width="210" height="32" rx="6"/>
  <rect x="360" y="44" width="210" height="32" rx="6" fill="url(#hatch)"/>
  <text class="t-s tc-muted" x="580" y="65">자격 없음 (1.5 &gt; V)</text>

  <text class="t-b" x="20" y="116">B</text>
  <text class="t-xs" x="38" y="116">가중치 1 · 4ms</text>
  <rect class="box green" x="150" y="96" width="560" height="32" rx="6"/>
  <text class="t-s t-ink mid" x="500" y="117">자격 있음 · 데드라인 4</text>

  <text class="t-b" x="20" y="168">C</text>
  <text class="t-xs" x="38" y="168">가중치 1 · 1ms</text>
  <rect class="solid green" x="290" y="148" width="140" height="32" rx="6"/>
  <text class="t-s t-b t-on mid" x="360" y="169">데드라인 2</text>
  <path class="ln green" d="M440 164 H470" marker-start="url(#ah-green)"/>
  <text class="t-s t-ink t-b" x="478" y="169">가장 이르다. C가 뽑힌다</text>

  <!-- 눈금 -->
  <path class="ln thin muted" d="M150 206 H726" marker-end="url(#ah-muted)"/>
  <path class="ln thin muted" d="M150 200 V212"/>
  <path class="ln thin muted" d="M430 200 V212"/>
  <path class="ln thin muted" d="M570 200 V212"/>
  <path class="ln thin muted" d="M710 200 V212"/>
  <text class="t-code mid" x="150" y="230">0</text>
  <text class="t-code mid" x="290" y="230">1</text>
  <text class="t-code mid" x="430" y="230">2</text>
  <text class="t-code mid" x="570" y="230">3</text>
  <text class="t-code mid" x="710" y="230">4</text>
  <text class="t-xs" x="20" y="230">가상 시간</text>

  <text class="t-s t-ink mid" x="380" y="268">막대의 왼쪽 끝은 vruntime, 오른쪽 끝은 가상 데드라인(vruntime + slice ÷ 가중치)이다</text>
  <text class="t-xs mid" x="380" y="288">CFS라면 vruntime이 가장 작은 B를 골랐을 것이다</text>
</svg>
