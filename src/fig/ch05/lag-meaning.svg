<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg">
  <title>가상 시간 축 위에서 가중 평균 V보다 왼쪽에 있는 태스크는 lag가 양수이고 자격이 있으며, 오른쪽에 있는 태스크는 lag가 음수이고 자격이 없다.</title>

  <rect class="panel green" x="20" y="48" width="380" height="118" rx="12"/>
  <rect class="panel gray" x="400" y="48" width="340" height="118" rx="12"/>
  <text class="t-b tc-green" x="36" y="72">자격 있음 · v ≤ V</text>
  <text class="t-b tc-muted end" x="724" y="72">자격 없음 · v &gt; V</text>

  <!-- 가상 시간 축 -->
  <path class="ln" d="M36 120 H722" marker-end="url(#ah)"/>
  <text class="t-xs end" x="724" y="156">가상 시간</text>

  <!-- V -->
  <path class="ln thick purple" d="M400 34 V182"/>
  <text class="t-l tc-purple mid" x="400" y="26">V</text>
  <text class="t-xs" x="414" y="26">실행 가능한 태스크의 vruntime 가중 평균</text>

  <!-- 태스크 -->
  <circle class="solid blue" cx="180" cy="120" r="17"/>
  <text class="t-b t-on mid" x="180" y="125">A</text>
  <circle class="solid" cx="440" cy="120" r="17"/>
  <text class="t-b t-on mid" x="440" y="125">B</text>
  <circle class="solid" cx="580" cy="120" r="17"/>
  <text class="t-b t-on mid" x="580" y="125">C</text>

  <!-- lag -->
  <path class="ln green" d="M180 94 H394" marker-end="url(#ah-green)"/>
  <text class="t-s tc-green mid" x="288" y="88">lag &gt; 0 · 덜 받았다</text>
  <path class="ln red" d="M580 94 H406" marker-end="url(#ah-red)"/>
  <text class="t-s tc-red mid" x="520" y="88">lag &lt; 0 · 더 받았다</text>

  <text class="t-s t-ink mid" x="380" y="208">lag = 가중치 × (V − vruntime). 이상적인 CPU라면 모든 태스크가 V에 있다</text>
  <text class="t-s mid" x="380" y="232">세 태스크의 가중치가 같다면 A의 lag는 B와 C의 lag를 더한 것과 크기가 같다. 합은 언제나 0이다</text>
</svg>
