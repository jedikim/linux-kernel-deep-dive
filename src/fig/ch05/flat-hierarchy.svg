<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
  <title>cgroup 계층은 태스크의 실효 가중치 h_load를 정하는 데 쓰이고, 태스크는 모두 CPU의 루트 cfs_rq 트리 하나에 들어가 거기서 선택된다.</title>

  <!-- 왼쪽: 계층 -->
  <text class="t-b" x="20" y="28">cgroup 계층</text>
  <text class="t-xs" x="112" y="28">가중치를 정한다</text>

  <path class="ln thin" d="M200 78 L120 112"/>
  <path class="ln thin" d="M200 78 L310 112"/>
  <rect class="box gray" x="150" y="44" width="100" height="34" rx="8"/>
  <text class="t-b mid" x="200" y="66">루트</text>
  <text class="t-xs" x="118" y="98">1/2</text>
  <text class="t-xs" x="270" y="98">1/2</text>

  <rect class="box blue" x="30" y="112" width="180" height="46" rx="8"/>
  <text class="t-b" x="44" y="132">그룹 G1</text>
  <text class="t-code" x="44" y="150">cpu.weight 100</text>
  <rect class="box warm" x="240" y="112" width="140" height="46" rx="8"/>
  <text class="t-b" x="254" y="132">그룹 G2</text>
  <text class="t-code" x="254" y="150">cpu.weight 100</text>

  <path class="ln thin blue" d="M120 158 L52 196"/>
  <path class="ln thin blue" d="M120 158 L98 196"/>
  <path class="ln thin blue" d="M120 158 L144 196"/>
  <path class="ln thin blue" d="M120 158 L190 196"/>
  <path class="ln thin warm" d="M310 158 V196"/>
  <rect class="box blue" x="32" y="196" width="40" height="30" rx="6"/>
  <text class="t-code mid" x="52" y="216">t1</text>
  <rect class="box blue" x="78" y="196" width="40" height="30" rx="6"/>
  <text class="t-code mid" x="98" y="216">t2</text>
  <rect class="box blue" x="124" y="196" width="40" height="30" rx="6"/>
  <text class="t-code mid" x="144" y="216">t3</text>
  <rect class="box blue" x="170" y="196" width="40" height="30" rx="6"/>
  <text class="t-code mid" x="190" y="216">t4</text>
  <rect class="box warm" x="290" y="196" width="40" height="30" rx="6"/>
  <text class="t-code mid" x="310" y="216">t5</text>
  <text class="t-xs mid" x="120" y="244">G1 안에서 각 1/4</text>
  <text class="t-xs mid" x="310" y="244">G2 안에서 1/1</text>

  <!-- 화살표 -->
  <path class="ln green" d="M392 150 H436" marker-end="url(#ah-green)"/>

  <!-- 오른쪽: 트리 하나 -->
  <rect class="panel green" x="440" y="14" width="300" height="236" rx="14"/>
  <text class="t-b" x="456" y="38">CPU의 트리 하나</text>
  <text class="t-xs end" x="724" y="38">여기서 고른다</text>
  <text class="t-code" x="456" y="58">rq->cfs.tasks_timeline</text>

  <rect class="box blue" x="456" y="70" width="40" height="26" rx="6"/>
  <text class="t-code mid" x="476" y="88">t1</text>
  <rect class="solid blue" x="506" y="78" width="40" height="10" rx="3"/>
  <text class="t-xs" x="556" y="88">h_load 1/4 · 몫 1/8</text>

  <rect class="box blue" x="456" y="102" width="40" height="26" rx="6"/>
  <text class="t-code mid" x="476" y="120">t2</text>
  <rect class="solid blue" x="506" y="110" width="40" height="10" rx="3"/>
  <text class="t-xs" x="556" y="120">h_load 1/4 · 몫 1/8</text>

  <rect class="box blue" x="456" y="134" width="40" height="26" rx="6"/>
  <text class="t-code mid" x="476" y="152">t3</text>
  <rect class="solid blue" x="506" y="142" width="40" height="10" rx="3"/>
  <text class="t-xs" x="556" y="152">h_load 1/4 · 몫 1/8</text>

  <rect class="box blue" x="456" y="166" width="40" height="26" rx="6"/>
  <text class="t-code mid" x="476" y="184">t4</text>
  <rect class="solid blue" x="506" y="174" width="40" height="10" rx="3"/>
  <text class="t-xs" x="556" y="184">h_load 1/4 · 몫 1/8</text>

  <rect class="box warm" x="456" y="204" width="40" height="26" rx="6"/>
  <text class="t-code mid" x="476" y="222">t5</text>
  <rect class="solid warm" x="506" y="212" width="160" height="10" rx="3"/>
  <text class="t-xs" x="506" y="242">h_load 1 · 몫 1/2</text>

  <text class="t-s t-ink mid" x="380" y="284">실효 가중치 h_load는 계층을 따라 올라가며 각 단계의 비율을 곱한 값이다</text>
  <text class="t-s mid" x="380" y="306">G1의 넷과 G2의 하나가 같은 트리에서 경쟁하고, 결과는 그룹별로 절반씩이다</text>
  <text class="t-xs mid" x="380" y="324">h_load는 nice 0 가중치에 대한 비. CPU 하나만 본 그림이다</text>
</svg>
