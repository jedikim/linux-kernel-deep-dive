<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg">
  <title>2차원 페이지 워크: 게스트 페이지 테이블의 네 단계와 마지막 데이터 주소마다 EPT 네 단계를 따라가야 하므로, TLB 미스 한 번에 최대 24번 메모리를 읽는다.</title>

