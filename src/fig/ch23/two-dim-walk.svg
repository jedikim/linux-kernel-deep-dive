  <rect class="box blue" x="290" y="320" width="14" height="14" rx="3"/>
  <text class="t-s" x="312" y="332">게스트 페이지 테이블 읽기 4번</text>
  <text class="t-s t-ink t-b end" x="740" y="332">합계 24번 · 가상화 없이는 4번</text>
