<svg viewBox="0 0 760 392" xmlns="http://www.w3.org/2000/svg">
  <title>ref-walk와 RCU-walk 비교: ref-walk는 지나가는 dentry마다 락을 잡고 참조 카운트를 올리지만 RCU-walk는 d_seq를 읽고 확인만 하다가 마지막 dentry에서만 참조를 얻는다</title>

  <!-- 경로의 dentry -->
  <rect class="box gray" x="164" y="14" width="136" height="34" rx="8"/>
  <text class="t-mono t-b mid" x="232" y="36">/</text>
  <rect class="box gray" x="308" y="14" width="136" height="34" rx="8"/>
  <text class="t-mono t-b mid" x="376" y="36">usr</text>
  <rect class="box gray" x="452" y="14" width="136" height="34" rx="8"/>
  <text class="t-mono t-b mid" x="520" y="36">lib</text>
  <rect class="box gray" x="596" y="14" width="136" height="34" rx="8"/>
  <text class="t-mono t-b mid" x="664" y="36">libc.so.6</text>

  <!-- ref-walk -->
  <text class="t-b" x="20" y="98">ref-walk</text>
  <text class="t-xs" x="20" y="118">성분마다 락과 참조</text>
  <rect class="box red" x="164" y="66" width="136" height="78" rx="8"/>
  <text class="t-s t-ink mid" x="232" y="88">d_lock 잡기</text>
  <text class="t-s t-ink mid" x="232" y="106">참조 카운트 +1</text>
  <text class="t-xs tc-red mid" x="232" y="130">공유 캐시 라인에 쓰기</text>
  <rect class="box red" x="308" y="66" width="136" height="78" rx="8"/>
  <text class="t-s t-ink mid" x="376" y="88">d_lock 잡기</text>
  <text class="t-s t-ink mid" x="376" y="106">참조 카운트 +1</text>
  <text class="t-xs tc-red mid" x="376" y="130">공유 캐시 라인에 쓰기</text>
  <rect class="box red" x="452" y="66" width="136" height="78" rx="8"/>
  <text class="t-s t-ink mid" x="520" y="88">d_lock 잡기</text>
  <text class="t-s t-ink mid" x="520" y="106">참조 카운트 +1</text>
  <text class="t-xs tc-red mid" x="520" y="130">공유 캐시 라인에 쓰기</text>
  <rect class="box red" x="596" y="66" width="136" height="78" rx="8"/>
  <text class="t-s t-ink mid" x="664" y="88">d_lock 잡기</text>
  <text class="t-s t-ink mid" x="664" y="106">참조 카운트 +1</text>
  <text class="t-xs tc-red mid" x="664" y="130">공유 캐시 라인에 쓰기</text>

  <!-- RCU-walk -->
  <text class="t-b" x="20" y="202">RCU-walk</text>
  <text class="t-xs" x="20" y="222">rcu_read_lock() 한 번</text>
  <rect class="box green" x="164" y="170" width="136" height="78" rx="8"/>
  <text class="t-s t-ink mid" x="232" y="194">d_seq 읽기</text>
  <text class="t-s t-ink mid" x="232" y="214">이름 비교</text>
  <text class="t-s t-ink mid" x="232" y="234">d_seq 다시 확인</text>
  <rect class="box green" x="308" y="170" width="136" height="78" rx="8"/>
  <text class="t-s t-ink mid" x="376" y="194">d_seq 읽기</text>
  <text class="t-s t-ink mid" x="376" y="214">이름 비교</text>
  <text class="t-s t-ink mid" x="376" y="234">d_seq 다시 확인</text>
  <rect class="box green" x="452" y="170" width="136" height="78" rx="8"/>
  <text class="t-s t-ink mid" x="520" y="194">d_seq 읽기</text>
  <text class="t-s t-ink mid" x="520" y="214">이름 비교</text>
  <text class="t-s t-ink mid" x="520" y="234">d_seq 다시 확인</text>
  <rect class="box warm" x="596" y="170" width="136" height="78" rx="8"/>
  <text class="t-s t-ink mid" x="664" y="194">d_seq 읽기 · 비교</text>
  <text class="t-s t-ink mid" x="664" y="214">참조 카운트 +1</text>
  <text class="t-code tc-warm mid" x="664" y="234">try_to_unlazy()</text>
  <text class="t-xs tc-green mid" x="376" y="268">지나가는 dentry에는 쓰지 않는다</text>
  <text class="t-xs tc-warm mid" x="664" y="268">목적지에서만 쓴다</text>

  <path class="ln thin muted" d="M20 284 H740"/>

  <!-- 세 번의 시도 -->
  <text class="t-s t-ink t-b" x="20" y="308">do_file_open()의 세 번의 시도</text>
  <rect class="box green" x="20" y="320" width="200" height="40" rx="8"/>
  <text class="t-b mid" x="120" y="345">① RCU-walk</text>
  <path class="ln" d="M220 340 H296" marker-end="url(#ah)"/>
  <text class="t-code mid" x="258" y="332">-ECHILD</text>
  <rect class="box red" x="300" y="320" width="160" height="40" rx="8"/>
  <text class="t-b mid" x="380" y="345">② ref-walk</text>
  <path class="ln" d="M460 340 H536" marker-end="url(#ah)"/>
  <text class="t-code mid" x="498" y="332">-ESTALE</text>
  <rect class="box gray" x="540" y="320" width="200" height="40" rx="8"/>
  <text class="t-b mid" x="640" y="345">③ LOOKUP_REVAL</text>
  <text class="t-xs mid" x="120" y="378">대부분 여기서 끝난다</text>
  <text class="t-xs mid" x="380" y="378">경쟁 · 캐시 미스 · 잠들어야 할 때</text>
  <text class="t-xs mid" x="640" y="378">NFS 등: 캐시를 믿지 않고 재확인</text>
</svg>
