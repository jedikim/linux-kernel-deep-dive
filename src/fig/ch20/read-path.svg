<svg viewBox="0 0 760 436" xmlns="http://www.w3.org/2000/svg">
  <title>filemap_get_pages()의 세 경우: 캐시에 있으면 복사만 하고, 없으면 미리 읽기가 폴리오를 만들어 디스크에서 읽을 때까지 기다리고, 미리 읽기 표시에 닿으면 다음 창을 비동기로 읽기 시작한다</title>

  <!-- 1 -->
  <rect class="panel green" x="20" y="14" width="720" height="92" rx="14"/>
  <text class="t-b tc-green" x="36" y="38">① 캐시에 있다</text>
  <text class="t-xs end" x="724" y="38">디스크 I/O 없음</text>
  <rect class="box" x="36" y="50" width="220" height="42" rx="8"/>
  <text class="t-code mid" x="146" y="67">filemap_get_read_batch()</text>
  <text class="t-xs mid" x="146" y="84">xarray 조회 · RCU, 락 없음</text>
  <path class="ln green" d="M256 71 H286" marker-end="url(#ah-green)"/>
  <rect class="box" x="290" y="50" width="200" height="42" rx="8"/>
  <text class="t-code mid" x="390" y="67">copy_folio_to_iter()</text>
  <text class="t-xs mid" x="390" y="84">폴리오 → 유저 버퍼</text>
  <path class="ln green" d="M490 71 H520" marker-end="url(#ah-green)"/>
  <rect class="box green" x="524" y="50" width="200" height="42" rx="8"/>
  <text class="t-b mid" x="624" y="76">read() 복귀</text>

  <!-- 2 -->
  <rect class="panel warm" x="20" y="118" width="720" height="126" rx="14"/>
  <text class="t-b tc-warm" x="36" y="142">② 캐시에 없다</text>
  <text class="t-xs end" x="724" y="142">태스크가 read() 안에서 잠든다</text>
  <rect class="box" x="36" y="154" width="166" height="42" rx="8"/>
  <text class="t-code mid" x="119" y="171">page_cache_sync_ra()</text>
  <text class="t-xs mid" x="119" y="188">폴리오 할당 · 삽입(잠금)</text>
  <path class="ln warm" d="M202 175 H230" marker-end="url(#ah-warm)"/>
  <rect class="box" x="234" y="154" width="150" height="42" rx="8"/>
  <text class="t-code mid" x="309" y="171">a_ops-&gt;readahead()</text>
  <text class="t-xs mid" x="309" y="188">bio 제출 → 블록 계층</text>
  <path class="ln warm" d="M384 175 H412" marker-end="url(#ah-warm)"/>
  <rect class="box warm" x="416" y="154" width="166" height="42" rx="8"/>
  <text class="t-code mid" x="499" y="171">filemap_update_page()</text>
  <text class="t-xs mid" x="499" y="188">I/O가 끝나기를 기다림</text>
  <path class="ln warm" d="M582 175 H610" marker-end="url(#ah-warm)"/>
  <rect class="box" x="614" y="154" width="110" height="42" rx="8"/>
  <text class="t-b mid" x="669" y="180">복사 · 복귀</text>
  <path class="ln muted" d="M309 196 V208" marker-end="url(#ah-muted)"/>
  <rect class="box gray" x="234" y="212" width="348" height="22" rx="6"/>
  <text class="t-xs t-ink mid" x="408" y="228">저장 장치가 읽는 동안 CPU는 다른 태스크를 돌린다</text>
  <path class="ln muted" d="M499 212 V200" marker-end="url(#ah-muted)"/>

  <!-- 3 -->
  <rect class="panel blue" x="20" y="256" width="720" height="92" rx="14"/>
  <text class="t-b tc-blue" x="36" y="280">③ 미리 읽은 창의 표시에 닿았다</text>
  <text class="t-xs end" x="724" y="280">기다리지 않는다</text>
  <rect class="box" x="36" y="292" width="200" height="42" rx="8"/>
  <text class="t-code mid" x="136" y="309">folio_test_readahead()</text>
  <text class="t-xs mid" x="136" y="326">표시(PG_readahead)를 봄</text>
  <path class="ln blue" d="M236 313 H260" marker-end="url(#ah-blue)"/>
  <rect class="box blue" x="264" y="292" width="220" height="42" rx="8"/>
  <text class="t-code mid" x="374" y="309">page_cache_async_ra()</text>
  <text class="t-xs mid" x="374" y="326">다음 창 읽기를 걸어 두고 넘어감</text>
  <path class="ln blue" d="M484 313 H508" marker-end="url(#ah-blue)"/>
  <rect class="box" x="512" y="292" width="212" height="42" rx="8"/>
  <text class="t-code mid" x="618" y="309">copy_folio_to_iter()</text>
  <text class="t-xs mid" x="618" y="326">지금 요청은 바로 복귀</text>

  <!-- 폴리오 띠 -->
  <text class="t-xs" x="20" y="386">파일의 폴리오</text>
  <rect class="box green" x="130" y="370" width="44" height="24"/>
  <rect class="box green" x="178" y="370" width="44" height="24"/>
  <rect class="box green" x="226" y="370" width="44" height="24"/>
  <rect class="box green" x="274" y="370" width="44" height="24"/>
  <rect class="box green" x="322" y="370" width="44" height="24"/>
  <rect class="box green" x="370" y="370" width="44" height="24"/>
  <rect class="box blue" x="418" y="370" width="44" height="24"/>
  <text class="t-xs t-ink mid" x="440" y="387">표시</text>
  <rect class="box green" x="466" y="370" width="44" height="24"/>
  <rect class="ghost dash" x="514" y="370" width="44" height="24"/>
  <rect class="ghost dash" x="562" y="370" width="44" height="24"/>
  <rect class="ghost dash" x="610" y="370" width="44" height="24"/>
  <rect class="ghost dash" x="658" y="370" width="44" height="24"/>
  <path class="ln thin green" d="M130 402 H510"/>
  <text class="t-xs mid" x="320" y="420">읽어 둔 범위 (uptodate)</text>
  <path class="ln thin blue" d="M514 402 H702"/>
  <text class="t-xs mid" x="608" y="420">표시에 닿으면 읽기 시작하는 다음 창</text>
</svg>
