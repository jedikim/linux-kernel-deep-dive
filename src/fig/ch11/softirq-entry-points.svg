<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <title>softirq가 실행되는 세 자리: 인터럽트 복귀 길, local_bh_enable(), ksoftirqd. 셋 다 handle_softirqs()로 모이고, 한도를 넘으면 남은 일이 ksoftirqd로 넘어간다.</title>

  <rect class="box warm" x="20" y="16" width="440" height="64" rx="10"/>
  <text class="t-b" x="34" y="41">① 인터럽트에서 돌아가는 길</text>
  <text class="t-code" x="34" y="64">irq_exit_rcu() → invoke_softirq() → __do_softirq()</text>
  <text class="t-xs tc-warm end" x="448" y="41">hardirq 직후</text>

  <rect class="box blue" x="20" y="92" width="440" height="64" rx="10"/>
  <text class="t-b" x="34" y="117">② BH를 다시 켤 때</text>
  <text class="t-code" x="34" y="140">local_bh_enable() → __local_bh_enable_ip() → do_softirq()</text>
  <text class="t-xs tc-blue end" x="448" y="117">태스크 컨텍스트</text>

  <rect class="box blue" x="20" y="168" width="440" height="64" rx="10"/>
  <text class="t-b" x="34" y="193">③ ksoftirqd가 깨어났을 때</text>
  <text class="t-code" x="34" y="216">run_ksoftirqd() → handle_softirqs(true)</text>
  <text class="t-xs tc-blue end" x="448" y="193">CPU별 커널 스레드</text>

  <path class="ln warm" d="M460 48 H554" marker-end="url(#ah-warm)"/>
  <path class="ln blue" d="M460 124 H554" marker-end="url(#ah-blue)"/>
  <path class="ln blue" d="M460 200 H554" marker-end="url(#ah-blue)"/>

  <rect class="box purple" x="560" y="16" width="180" height="216" rx="12"/>
  <text class="t-mono t-b mid" x="650" y="46">handle_softirqs()</text>
  <text class="t-s mid" x="650" y="76">pending을 0으로 지운다</text>
  <text class="t-s mid" x="650" y="96">인터럽트를 켠다</text>
  <text class="t-s mid" x="650" y="116">선 비트마다 action()</text>
  <path class="ln thin purple dash" d="M576 134 H724"/>
  <text class="t-s t-ink t-b mid" x="650" y="158">다시 돌 조건</text>
  <text class="t-s mid" x="650" y="180">2ms가 지나지 않았고</text>
  <text class="t-s mid" x="650" y="200">재시작 10회 미만이고</text>
  <text class="t-s mid" x="650" y="220">need_resched()가 아님</text>

  <path class="ln red" d="M650 232 V260 H240 V238" marker-end="url(#ah-red)"/>
  <text class="t-s tc-red mid" x="445" y="282">pending이 남았는데 조건이 깨졌다 → wakeup_softirqd()</text>
</svg>
