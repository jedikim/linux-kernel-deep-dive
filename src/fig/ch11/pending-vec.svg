<svg viewBox="0 0 760 362" xmlns="http://www.w3.org/2000/svg">
  <title>CPU마다 따로 있는 softirq pending 비트맵과 전역 배열 softirq_vec의 대응. 비트 번호가 곧 배열 인덱스이고, 선 비트의 핸들러가 번호 순서로 불린다.</title>

