<svg viewBox="0 0 760 266" xmlns="http://www.w3.org/2000/svg">
  <title>스레드 IRQ의 시간선: hardirq에서 도는 1차 핸들러가 IRQ_WAKE_THREAD를 돌려주면 irq 스레드가 깨어나 스레드 함수를 실행하고, IRQF_ONESHOT이면 그동안 IRQ 선이 막혀 있다.</title>

  <text class="t-xs mid" x="250" y="20">인터럽트 발생</text>
  <path class="ln thin muted dash" d="M250 26 V36"/>

  <!-- IRQ 선 -->
  <text class="t-s t-ink t-b" x="20" y="54">IRQ 선</text>
  <rect class="box" x="150" y="40" width="100" height="20" rx="4"/>
  <text class="t-xs mid" x="200" y="54">열림</text>
  <rect class="box red" x="250" y="40" width="360" height="20" rx="4"/>
  <text class="t-xs tc-red mid" x="430" y="54">IRQF_ONESHOT: 스레드 함수가 끝날 때까지 막아 둔다</text>
  <rect class="box" x="610" y="40" width="130" height="20" rx="4"/>
  <text class="t-xs mid" x="675" y="54">열림</text>

  <!-- hardirq -->
  <text class="t-s t-ink t-b" x="20" y="99">hardirq</text>
  <rect class="box warm" x="250" y="80" width="40" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="270" y="100">1차</text>
  <text class="t-xs" x="300" y="100">자기 장치인지 확인하고 IRQ_WAKE_THREAD를 돌려준다</text>

  <!-- IRQ 스레드 -->
  <text class="t-s t-ink t-b" x="20" y="136">IRQ 스레드</text>
  <text class="t-code" x="20" y="155">irq/42-sensor</text>
  <path class="ln thin blue" d="M270 110 V139 H284" marker-end="url(#ah-blue)"/>
  <rect class="box blue" x="290" y="124" width="110" height="30" rx="6"/>
  <text class="t-code mid" x="345" y="143">thread_fn</text>
  <rect class="ghost blue dash" x="400" y="124" width="100" height="30" rx="6"/>
  <text class="t-xs tc-blue mid" x="450" y="143">잠듦 (버스 대기)</text>
  <rect class="box blue" x="500" y="124" width="110" height="30" rx="6"/>
  <text class="t-code mid" x="555" y="143">thread_fn</text>
  <text class="t-xs" x="620" y="143">SCHED_FIFO 50</text>

  <!-- 태스크 A -->
  <text class="t-s t-ink t-b" x="20" y="188">태스크 A</text>
  <rect class="box gray" x="150" y="168" width="100" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="200" y="188">A 실행</text>
  <rect class="box gray" x="400" y="168" width="100" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="450" y="188">A 실행</text>
  <rect class="box gray" x="610" y="168" width="130" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="675" y="188">A 실행</text>

  <text class="t-s mid" x="380" y="228">1차 핸들러는 인터럽트를 끈 채 돈다. 스레드 함수는 선점될 수 있고, 뮤텍스를 잡거나 잠들 수 있다.</text>
  <text class="t-s mid" x="380" y="250">스레드가 잠든 동안에는 다른 태스크가 CPU를 쓴다.</text>
</svg>
