<svg viewBox="0 0 760 524" xmlns="http://www.w3.org/2000/svg">
  <title>v7.3 x86-64 고해상도 모드에서 틱 한 번의 호출 사슬: LAPIC 타이머 인터럽트에서 hrtimer_interrupt, tick_nohz_handler를 거쳐 jiffies 갱신과 update_process_times로 갈라진다</title>

  <rect class="box gray" x="20" y="14" width="720" height="38" rx="10"/>
  <use href="#i-clock" x="30" y="20" width="26" height="26" class="ic gray"/>
  <text class="t-b" x="64" y="38">LAPIC 타이머가 만료된다</text>
  <text class="t-code end" x="728" y="38">벡터 0xec (LOCAL_TIMER_VECTOR)</text>
  <path class="ln" d="M380 52 V63" marker-end="url(#ah)"/>

  <rect class="box" x="20" y="68" width="720" height="50" rx="10"/>
  <text class="t-mono t-b" x="34" y="89">sysvec_apic_timer_interrupt()</text>
  <text class="t-xs end" x="728" y="89">arch/x86/kernel/apic/apic.c</text>
  <text class="t-s" x="34" y="108">EOI를 보내고 이 CPU의 clock_event_device에 등록된 event_handler를 부른다</text>
  <path class="ln" d="M380 118 V129" marker-end="url(#ah)"/>

  <rect class="box warm" x="20" y="134" width="720" height="50" rx="10"/>
  <text class="t-mono t-b" x="34" y="155">hrtimer_interrupt()</text>
  <text class="t-xs end" x="728" y="155">kernel/time/hrtimer.c</text>
  <text class="t-s" x="34" y="174">만료 시각이 지난 hrtimer를 차례로 꺼내 콜백을 실행한다. 틱도 그중 하나다</text>
  <path class="ln" d="M380 184 V195" marker-end="url(#ah)"/>

  <rect class="box warm" x="20" y="200" width="720" height="50" rx="10"/>
  <text class="t-mono t-b" x="34" y="221">tick_nohz_handler()</text>
  <text class="t-xs end" x="728" y="221">kernel/time/tick-sched.c</text>
  <text class="t-s" x="34" y="240">CPU마다 하나씩 있는 hrtimer인 sched_timer의 콜백. 여기서 두 가지 일로 갈라진다</text>

  <path class="ln blue" d="M170 250 V265" marker-end="url(#ah-blue)"/>
  <path class="ln green" d="M540 250 V265" marker-end="url(#ah-green)"/>

  <!-- 왼쪽: 시스템 전체의 시간 -->
  <rect class="panel blue" x="20" y="270" width="300" height="184" rx="12"/>
  <text class="t-b tc-blue" x="34" y="294">① 시스템 전체의 시간</text>
  <text class="t-code" x="34" y="318">tick_sched_do_timer()</text>
  <text class="t-code" x="34" y="338">└ tick_do_update_jiffies64()</text>
  <rect class="box" x="34" y="350" width="272" height="68" rx="8"/>
  <text class="t-code" x="46" y="370">jiffies_64 += ticks</text>
  <text class="t-code" x="46" y="389">calc_global_load()</text>
  <text class="t-xs end" x="296" y="389">부하 평균</text>
  <text class="t-code" x="46" y="408">update_wall_time()</text>
  <text class="t-xs end" x="296" y="408">timekeeper</text>
  <text class="t-xs tc-blue" x="34" y="440">tick_do_timer_cpu로 지정된 CPU 하나만 한다</text>

  <!-- 오른쪽: 이 CPU의 태스크 -->
  <rect class="panel green" x="340" y="270" width="400" height="184" rx="12"/>
  <text class="t-b tc-green" x="354" y="294">② 이 CPU에서 돌던 태스크</text>
  <text class="t-code" x="354" y="318">tick_sched_handle() → update_process_times()</text>
  <rect class="box" x="354" y="330" width="372" height="112" rx="8"/>
  <text class="t-code" x="366" y="350">account_process_tick()</text>
  <text class="t-xs end" x="716" y="350">유저·시스템 시간 누적</text>
  <text class="t-code" x="366" y="370">run_local_timers()</text>
  <text class="t-xs end" x="716" y="370">타이머 휠 → TIMER_SOFTIRQ</text>
  <text class="t-code" x="366" y="390">rcu_sched_clock_irq()</text>
  <text class="t-xs end" x="716" y="390">RCU 정지 상태 확인</text>
  <text class="t-code" x="366" y="410">sched_tick()</text>
  <text class="t-xs end" x="716" y="410">타임 슬라이스 검사, 재스케줄 요청</text>
  <text class="t-code" x="366" y="430">run_posix_cpu_timers()</text>
  <text class="t-xs end" x="716" y="430">CPU 시간 기준 타이머</text>

  <path class="ln" d="M170 454 V469" marker-end="url(#ah)"/>
  <path class="ln" d="M540 454 V469" marker-end="url(#ah)"/>

  <rect class="box warm" x="20" y="474" width="720" height="36" rx="10"/>
  <text class="t-mono" x="34" y="497">hrtimer_forward(timer, now, TICK_NSEC)</text>
  <text class="t-xs end" x="728" y="497">다음 틱 시각으로 다시 맞춘다 (HRTIMER_RESTART)</text>
</svg>
