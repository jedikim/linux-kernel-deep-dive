<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg">
  <title>같은 IRQ를 두 CPU가 만나는 세 가지 경우의 시간선: CPU 0이 처리하는 동안 CPU 1에 같은 IRQ가 오면 CPU 1은 PENDING만 세우고 돌아가고, CPU 0이 끝내기 전에 그것을 보고 한 번 더 처리한다</title>

  <!-- CPU 0 -->
  <text class="t-b" x="20" y="64">CPU 0</text>
  <text class="t-xs tc-blue" x="120" y="34">① 아무도 처리 중이 아니다 → 내가 처리한다</text>
  <rect class="box warm" x="120" y="44" width="60" height="30" rx="5"/>
  <text class="t-xs t-ink mid" x="150" y="64">ack</text>
  <rect class="box blue" x="180" y="44" width="220" height="30" rx="5"/>
  <text class="t-xs t-ink mid" x="235" y="64">핸들러 실행</text>
  <rect class="box warm" x="400" y="44" width="50" height="30" rx="5"/>
  <text class="t-xs t-ink mid" x="425" y="64">확인</text>
  <rect class="box blue" x="450" y="44" width="170" height="30" rx="5"/>
  <text class="t-xs t-ink mid" x="535" y="64">핸들러 한 번 더</text>
  <rect class="box warm" x="620" y="44" width="50" height="30" rx="5"/>
  <text class="t-xs t-ink mid" x="645" y="64">확인</text>
  <text class="t-xs" x="678" y="64">복귀</text>
  <text class="t-xs tc-warm" x="400" y="92">③ 끝내기 전에 PENDING을 본다 → 마스크를 풀고 이어서 처리</text>

  <!-- CPU 1 -->
  <text class="t-b" x="20" y="150">CPU 1</text>
  <text class="t-xs tc-red" x="290" y="120">② CPU 0이 처리 중이다 → PENDING만 세우고 돌아간다</text>
  <rect class="box gray" x="120" y="130" width="160" height="30" rx="5"/>
  <text class="t-xs mid" x="200" y="150">하던 일</text>
  <rect class="box red" x="280" y="130" width="70" height="30" rx="5"/>
  <text class="t-xs t-ink mid" x="315" y="150">표시만</text>
  <rect class="box gray" x="350" y="130" width="380" height="30" rx="5"/>
  <text class="t-xs mid" x="540" y="150">하던 일로 복귀</text>
  <path class="ln thin red dash" d="M280 74 V130"/>

  <path class="ln thin muted" d="M20 182 H740"/>

  <!-- 상태 -->
  <text class="t-code" x="20" y="210">IRQD_IRQ_INPROGRESS</text>
  <rect class="solid blue" x="180" y="200" width="220" height="10" rx="3"/>
  <rect class="solid blue" x="450" y="200" width="170" height="10" rx="3"/>
  <text class="t-code" x="20" y="240">IRQS_PENDING</text>
  <rect class="solid red" x="315" y="230" width="135" height="10" rx="3"/>
  <text class="t-code" x="20" y="270">desc-&gt;lock</text>
  <rect class="solid" x="120" y="260" width="60" height="10" rx="3"/>
  <rect class="solid" x="280" y="260" width="70" height="10" rx="3"/>
  <rect class="solid" x="400" y="260" width="50" height="10" rx="3"/>
  <rect class="solid" x="620" y="260" width="50" height="10" rx="3"/>

  <text class="t-s" x="20" y="312">핸들러는 한 번에 한 CPU에서만 돈다. 늦게 온 CPU는 기다리지 않고 표시만 남긴다.</text>
  <text class="t-s" x="20" y="334">lock은 상태를 읽고 쓰는 짧은 구간에만 잡는다. 핸들러를 부르는 동안에는 풀려 있다.</text>
  <text class="t-s" x="20" y="356">그래서 CPU 1은 CPU 0의 핸들러가 끝나기를 기다리지 않고 lock을 얻어 PENDING을 세울 수 있다.</text>
</svg>
