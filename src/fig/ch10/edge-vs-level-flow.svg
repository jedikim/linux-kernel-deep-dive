<svg viewBox="0 0 760 384" xmlns="http://www.w3.org/2000/svg">
  <title>에지 트리거와 레벨 트리거의 플로 차이: 에지는 먼저 ack하고 처리 중에 온 에지를 이어서 처리하며, 레벨은 먼저 마스크하고 핸들러가 장치를 달랜 뒤 마스크를 푼다</title>

  <!-- 에지 -->
  <text class="t-b" x="20" y="26">에지 트리거</text>
  <text class="t-mono" x="112" y="26">handle_edge_irq()</text>
  <text class="t-xs" x="20" y="74">신호</text>
  <path class="ln" d="M130 80 H180 V58 H200 V80 H380 V58 H400 V80 H730"/>
  <path class="ln thin red dash" d="M390 58 V96"/>
  <text class="t-xs tc-red mid" x="390" y="46">처리 중에 온 두 번째 에지</text>
  <text class="t-xs" x="20" y="115">커널</text>
  <rect class="box warm" x="204" y="96" width="44" height="28" rx="5"/>
  <text class="t-xs t-ink mid" x="226" y="115">ack</text>
  <rect class="box blue" x="250" y="96" width="250" height="28" rx="5"/>
  <text class="t-xs t-ink mid" x="320" y="115">핸들러 실행</text>
  <rect class="box blue" x="502" y="96" width="180" height="28" rx="5"/>
  <text class="t-xs t-ink mid" x="592" y="115">한 번 더 실행</text>
  <text class="t-xs" x="130" y="146">ack를 먼저 해서 컨트롤러가 다음 에지를 받을 수 있게 한다. 처리 중에 온 것은 표시해 두었다가 이어서 처리한다.</text>

  <path class="ln thin muted dash" d="M20 164 H740"/>

  <!-- 레벨 -->
  <text class="t-b" x="20" y="192">레벨 트리거</text>
  <text class="t-mono" x="112" y="192">handle_level_irq()</text>
  <text class="t-xs" x="20" y="240">신호</text>
  <path class="ln" d="M130 246 H180 V224 H430 V246 H730"/>
  <path class="ln thin green dash" d="M430 224 V262"/>
  <text class="t-xs tc-green mid" x="430" y="212">드라이버가 장치의 원인을 지우면 선이 내려간다</text>
  <text class="t-xs" x="20" y="281">커널</text>
  <rect class="box warm" x="184" y="262" width="76" height="28" rx="5"/>
  <text class="t-xs t-ink mid" x="222" y="281">mask·ack</text>
  <rect class="box blue" x="262" y="262" width="230" height="28" rx="5"/>
  <text class="t-xs t-ink mid" x="340" y="281">핸들러 실행</text>
  <rect class="box warm" x="494" y="262" width="70" height="28" rx="5"/>
  <text class="t-xs t-ink mid" x="529" y="281">unmask</text>
  <text class="t-xs" x="130" y="312">선이 올라가 있는 동안은 요청이 계속 살아 있다. 먼저 막아 두지 않으면 핸들러가 장치를 달래기도 전에 다시 걸린다.</text>

  <path class="ln thin muted dash" d="M20 330 H740"/>

  <text class="t-b" x="20" y="356">fasteoi</text>
  <text class="t-mono" x="80" y="356">handle_fasteoi_irq()</text>
  <text class="t-xs" x="250" y="356">컨트롤러가 EOI를 받을 때까지 같은 인터럽트를 다시 올리지 않는다(IO-APIC, GIC).</text>
  <text class="t-xs" x="250" y="374">마스크할 필요 없이 핸들러 뒤에 eoi 한 번이면 된다.</text>
</svg>
