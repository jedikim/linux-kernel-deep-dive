<svg viewBox="0 0 760 344" xmlns="http://www.w3.org/2000/svg">
  <title>커널로 들어오는 세 문: 태스크가 일으키는 시스템 콜과 예외, 하드웨어가 일으키는 인터럽트. 커널 스레드는 커널 안에서만 실행된다.</title>

  <!-- 유저 공간 -->
  <rect class="panel blue" x="20" y="14" width="720" height="62" rx="12"/>
  <text class="t-b tc-blue" x="36" y="50">유저 공간</text>
  <rect class="box" x="130" y="28" width="120" height="34" rx="8"/>
  <text class="t-s t-ink mid" x="190" y="50">태스크 A</text>
  <rect class="box" x="330" y="28" width="120" height="34" rx="8"/>
  <text class="t-s t-ink mid" x="390" y="50">태스크 B</text>

  <!-- 커널 -->
  <rect class="panel yellow" x="20" y="100" width="720" height="168" rx="12"/>
  <text class="t-b tc-yellow" x="36" y="254">커널</text>

  <rect class="box teal" x="100" y="122" width="180" height="70" rx="10"/>
  <text class="t-l mid" x="190" y="146">① 시스템 콜</text>
  <text class="t-s mid" x="190" y="166">태스크가 요청한다</text>
  <text class="t-code mid" x="190" y="183">read(), fork(), mmap()</text>

  <rect class="box red" x="300" y="122" width="180" height="70" rx="10"/>
  <text class="t-l mid" x="390" y="146">② 예외</text>
  <text class="t-s mid" x="390" y="166">CPU가 문제를 만난다</text>
  <text class="t-s mid" x="390" y="183">페이지 폴트, 잘못된 명령어</text>

  <rect class="box warm" x="500" y="122" width="220" height="70" rx="10"/>
  <text class="t-l mid" x="610" y="146">③ 인터럽트</text>
  <text class="t-s mid" x="610" y="166">장치가 알린다</text>
  <text class="t-s mid" x="610" y="183">타이머, 네트워크 카드, 디스크</text>

  <rect class="box" x="100" y="206" width="380" height="48" rx="10"/>
  <text class="t-b" x="114" y="227">커널 스레드</text>
  <text class="t-s" x="114" y="245">커널이 스스로 만든 태스크</text>
  <text class="t-code end" x="468" y="236">kworker, ksoftirqd, kswapd</text>

  <!-- 하드웨어 -->
  <rect class="panel gray" x="20" y="290" width="720" height="42" rx="12"/>
  <text class="t-b" x="36" y="316">하드웨어</text>
  <use href="#i-clock" x="540" y="297" width="28" height="28" class="ic gray"/>
  <use href="#i-nic" x="596" y="297" width="28" height="28" class="ic gray"/>
  <use href="#i-disk" x="652" y="297" width="28" height="28" class="ic gray"/>
  <path class="ln warm" d="M610 290 V196" marker-end="url(#ah-warm)"/>

  <path class="ln blue" d="M190 62 V118" marker-end="url(#ah-blue)"/>
  <path class="ln blue" d="M390 62 V118" marker-end="url(#ah-blue)"/>
  <text class="t-xs tc-blue" x="204" y="94">실행 중인 태스크가 일으킨다</text>
  <text class="t-xs tc-warm end" x="600" y="282">실행 중인 태스크와 무관하게 온다</text>
</svg>
