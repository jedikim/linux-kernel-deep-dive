<svg viewBox="0 0 760 232" xmlns="http://www.w3.org/2000/svg">
  <title>소스를 읽는 순환: 질문, 찾기, 읽기, 돌아가는 시스템에서 확인하기, 역사 찾기, 그리고 다시 질문</title>

  <rect class="box yellow" x="20" y="20" width="132" height="110" rx="12"/>
  <text class="t-l mid" x="86" y="48">① 질문</text>
  <text class="t-xs mid" x="86" y="74">spin_lock()은</text>
  <text class="t-xs mid" x="86" y="92">왜 선점을</text>
  <text class="t-xs mid" x="86" y="110">끄는가?</text>

  <rect class="box blue" x="167" y="20" width="132" height="110" rx="12"/>
  <text class="t-l mid" x="233" y="48">② 찾기</text>
  <text class="t-code mid" x="233" y="76">git grep</text>
  <text class="t-code mid" x="233" y="96">elixir</text>
  <text class="t-xs mid" x="233" y="116">정의와 호출처</text>

  <rect class="box blue" x="314" y="20" width="132" height="110" rx="12"/>
  <text class="t-l mid" x="380" y="48">③ 읽기</text>
  <text class="t-xs mid" x="380" y="76">코드와 주석</text>
  <text class="t-code mid" x="380" y="96">Documentation/</text>
  <text class="t-xs mid" x="380" y="116">구조체부터 본다</text>

  <rect class="box green" x="461" y="20" width="132" height="110" rx="12"/>
  <text class="t-l mid" x="527" y="48">④ 확인</text>
  <text class="t-code mid" x="527" y="76">/proc, /sys</text>
  <text class="t-code mid" x="527" y="96">ftrace, bpftrace</text>
  <text class="t-xs mid" x="527" y="116">실제로 그렇게 도는가</text>

  <rect class="box purple" x="608" y="20" width="132" height="110" rx="12"/>
  <text class="t-l mid" x="674" y="48">⑤ 역사</text>
  <text class="t-code mid" x="674" y="76">git blame</text>
  <text class="t-code mid" x="674" y="96">lore, LWN</text>
  <text class="t-xs mid" x="674" y="116">왜 이렇게 되었는가</text>

  <path class="ln" d="M152 75 H163" marker-end="url(#ah)"/>
  <path class="ln" d="M299 75 H310" marker-end="url(#ah)"/>
  <path class="ln" d="M446 75 H457" marker-end="url(#ah)"/>
  <path class="ln" d="M593 75 H604" marker-end="url(#ah)"/>

  <path class="ln muted" d="M674 130 V176 H86 V134" marker-end="url(#ah-muted)"/>
  <text class="t-s mid" x="380" y="202">답이 다음 질문을 낳는다</text>
</svg>
