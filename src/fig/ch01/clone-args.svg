<svg viewBox="0 0 760 344" xmlns="http://www.w3.org/2000/svg">
  <title>struct clone_args의 배치와 크기 버전: 처음 여덟 필드 64바이트가 VER0, set_tid와 set_tid_size를 더한 80바이트가 VER1, cgroup을 더한 88바이트가 VER2이다. 커널은 넘겨받은 크기가 자기가 아는 크기와 다를 때 0으로 채우거나 0인지 검사해 호환성을 지킨다.</title>

  <text class="t-mono t-b" x="64" y="26">struct clone_args</text>
  <text class="t-xs end" x="56" y="26">오프셋</text>
  <text class="t-code tc-muted end" x="56" y="57">0</text>
  <rect class="box blue" x="64" y="40" width="186" height="24"/>
  <text class="t-code" x="76" y="57">flags</text>
  <text class="t-code tc-muted end" x="56" y="81">8</text>
  <rect class="box blue" x="64" y="64" width="186" height="24"/>
  <text class="t-code" x="76" y="81">pidfd</text>
  <text class="t-code tc-muted end" x="56" y="105">16</text>
  <rect class="box blue" x="64" y="88" width="186" height="24"/>
  <text class="t-code" x="76" y="105">child_tid</text>
  <text class="t-code tc-muted end" x="56" y="129">24</text>
  <rect class="box blue" x="64" y="112" width="186" height="24"/>
  <text class="t-code" x="76" y="129">parent_tid</text>
  <text class="t-code tc-muted end" x="56" y="153">32</text>
  <rect class="box blue" x="64" y="136" width="186" height="24"/>
  <text class="t-code" x="76" y="153">exit_signal</text>
  <text class="t-code tc-muted end" x="56" y="177">40</text>
  <rect class="box blue" x="64" y="160" width="186" height="24"/>
  <text class="t-code" x="76" y="177">stack</text>
  <text class="t-code tc-muted end" x="56" y="201">48</text>
  <rect class="box blue" x="64" y="184" width="186" height="24"/>
  <text class="t-code" x="76" y="201">stack_size</text>
  <text class="t-code tc-muted end" x="56" y="225">56</text>
  <rect class="box blue" x="64" y="208" width="186" height="24"/>
  <text class="t-code" x="76" y="225">tls</text>
  <text class="t-code tc-muted end" x="56" y="249">64</text>
  <rect class="box green" x="64" y="232" width="186" height="24"/>
  <text class="t-code" x="76" y="249">set_tid</text>
  <text class="t-code tc-muted end" x="56" y="273">72</text>
  <rect class="box green" x="64" y="256" width="186" height="24"/>
  <text class="t-code" x="76" y="273">set_tid_size</text>
  <text class="t-code tc-muted end" x="56" y="297">80</text>
  <rect class="box purple" x="64" y="280" width="186" height="24"/>
  <text class="t-code" x="76" y="297">cgroup</text>

  <path class="ln thin blue" d="M256 42 H264 V230 H256"/>
  <text class="t-s t-ink t-b" x="274" y="132">VER0 · 64바이트</text>
  <text class="t-xs" x="274" y="150">v5.3, clone3()와 함께</text>
  <path class="ln thin green" d="M256 234 H264 V278 H256"/>
  <text class="t-s t-ink t-b" x="274" y="252">VER1 · 80바이트</text>
  <text class="t-xs" x="274" y="270">v5.5, PID 지정</text>
  <path class="ln thin purple" d="M256 282 H264 V302 H256"/>
  <text class="t-s t-ink t-b" x="274" y="297">VER2 · 88바이트</text>
  <text class="t-xs" x="274" y="315">v5.7, CLONE_INTO_CGROUP</text>

  <text class="t-b" x="450" y="26">넘겨받은 size가 커널이 아는 크기와 다를 때</text>
  <rect class="box" x="450" y="40" width="290" height="76" rx="10"/>
  <text class="t-b" x="464" y="63">size가 더 작다</text>
  <text class="t-xs" x="464" y="83">옛 프로그램이 새 커널에서 도는 경우</text>
  <text class="t-s t-ink" x="464" y="103">모자란 뒤쪽 필드를 0으로 채운다</text>
  <rect class="box" x="450" y="128" width="290" height="54" rx="10"/>
  <text class="t-b" x="464" y="151">size가 같다</text>
  <text class="t-s t-ink" x="464" y="171">그대로 복사한다</text>
  <rect class="box" x="450" y="194" width="290" height="96" rx="10"/>
  <text class="t-b" x="464" y="217">size가 더 크다</text>
  <text class="t-xs" x="464" y="237">새 프로그램이 옛 커널에서 도는 경우</text>
  <text class="t-s t-ink" x="464" y="257">넘치는 바이트가 전부 0이면 통과,</text>
  <text class="t-s t-ink" x="464" y="276">하나라도 0이 아니면 -E2BIG</text>

  <text class="t-s" x="450" y="315">새 필드는 맨 뒤에만 붙인다.</text>
  <text class="t-s" x="450" y="333">0은 예전과 같은 동작을 뜻해야 한다.</text>
</svg>
