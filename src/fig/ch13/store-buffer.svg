<svg viewBox="0 0 760 326" xmlns="http://www.w3.org/2000/svg">
  <title>스토어 버퍼 때문에 생기는 재배치: 두 CPU가 각자 한 변수에 쓰고 상대의 변수를 읽을 때, 쓰기가 스토어 버퍼에 머무는 동안 읽기가 먼저 이루어져 둘 다 0을 읽는다</title>

  <!-- CPU 0 -->
  <rect class="box blue" x="30" y="16" width="300" height="134" rx="12"/>
  <text class="t-b tc-blue" x="44" y="40">CPU 0</text>
  <text class="t-mono" x="44" y="64">① x = 1;</text>
  <text class="t-mono" x="44" y="86">② r0 = y;</text>
  <text class="t-xs tc-red end" x="318" y="86">0을 읽는다</text>
  <rect class="box yellow" x="44" y="100" width="170" height="38" rx="8"/>
  <text class="t-xs" x="56" y="124">스토어 버퍼</text>
  <text class="t-code end" x="204" y="124">x = 1</text>

  <!-- CPU 1 -->
  <rect class="box green" x="430" y="16" width="300" height="134" rx="12"/>
  <text class="t-b tc-green" x="444" y="40">CPU 1</text>
  <text class="t-mono" x="444" y="64">① y = 1;</text>
  <text class="t-mono" x="444" y="86">② r1 = x;</text>
  <text class="t-xs tc-red end" x="718" y="86">0을 읽는다</text>
  <rect class="box yellow" x="546" y="100" width="170" height="38" rx="8"/>
  <text class="t-xs" x="558" y="124">스토어 버퍼</text>
  <text class="t-code end" x="706" y="124">y = 1</text>

  <!-- 메모리 -->
  <rect class="panel" x="230" y="204" width="300" height="62" rx="12"/>
  <rect class="box" x="260" y="212" width="90" height="24" rx="5"/>
  <text class="t-code mid" x="305" y="229">x: 0</text>
  <rect class="box" x="410" y="212" width="90" height="24" rx="5"/>
  <text class="t-code mid" x="455" y="229">y: 0</text>
  <text class="t-xs mid" x="380" y="256">캐시와 메모리: 모든 CPU가 보는 값</text>

  <!-- 쓰기: 버퍼에서 나중에 -->
  <path class="ln thin muted dash" d="M114 138 V224 H254" marker-end="url(#ah-muted)"/>
  <text class="t-xs" x="122" y="186">나중에 반영</text>
  <path class="ln thin muted dash" d="M646 138 V224 H506" marker-end="url(#ah-muted)"/>
  <text class="t-xs end" x="638" y="186">나중에 반영</text>

  <!-- 읽기: 지금 -->
  <path class="ln thin red" d="M455 210 L306 154" marker-end="url(#ah-red)"/>
  <path class="ln thin red" d="M305 210 L454 154" marker-end="url(#ah-red)"/>

  <text class="t-s mid" x="380" y="292">쓰기는 버퍼에 넣는 것으로 끝난 셈 치고 다음 명령으로 넘어간다. 그래서 r0과 r1이 둘 다 0일 수 있다.</text>
  <text class="t-s mid" x="380" y="312">x86에서도 일어나는 재배치다. 쓰기와 읽기 사이에 smp_mb()를 넣으면 막힌다.</text>
</svg>
