<svg viewBox="0 0 760 408" xmlns="http://www.w3.org/2000/svg">
  <title>인터럽트에서 돌아가는 두 갈래 길: 유저 모드로 복귀할 때의 유저 선점과 커널 모드로 복귀할 때의 커널 선점</title>

  <rect class="box yellow" x="290" y="14" width="180" height="42" rx="10"/>
  <use href="#i-bolt" x="304" y="21" width="28" height="28" class="ic yellow"/>
  <text class="t-b" x="340" y="41">인터럽트 발생</text>
  <path class="ln" d="M380 56 V74" marker-end="url(#ah)"/>

  <rect class="box" x="180" y="78" width="400" height="52" rx="10"/>
  <text class="t-b mid" x="380" y="100">인터럽트 핸들러</text>
  <text class="t-s mid" x="380" y="120">깨어난 태스크가 있으면 재스케줄 요청 플래그를 세운다</text>
  <path class="ln" d="M380 130 V148" marker-end="url(#ah)"/>

  <rect class="solid" x="280" y="152" width="200" height="36" rx="18"/>
  <text class="t-b t-on mid" x="380" y="175">끊긴 자리는 어디였나</text>
  <path class="ln blue" d="M280 170 H195 V210" marker-end="url(#ah-blue)"/>
  <path class="ln warm" d="M480 170 H565 V210" marker-end="url(#ah-warm)"/>

  <!-- 왼쪽: 유저 선점 -->
  <rect class="panel blue" x="20" y="216" width="350" height="180" rx="14"/>
  <text class="t-b tc-blue" x="36" y="241">유저 모드였다 → 유저 선점</text>
  <rect class="box" x="36" y="252" width="318" height="58" rx="10"/>
  <text class="t-b" x="50" y="276">끊어야 하는가</text>
  <text class="t-code end" x="342" y="276">TIF_NEED_RESCHED</text>
  <text class="t-s" x="50" y="298">유저 모드로 가는 길은 언제나 안전하다</text>
  <path class="ln" d="M120 310 V328" marker-end="url(#ah)"/>
  <path class="ln" d="M279 310 V328" marker-end="url(#ah)"/>
  <rect class="box green" x="36" y="332" width="168" height="52" rx="10"/>
  <text class="t-b mid" x="120" y="354">요청 있음</text>
  <text class="t-code mid" x="120" y="373">schedule()</text>
  <rect class="box gray" x="214" y="332" width="140" height="52" rx="10"/>
  <text class="t-b mid" x="284" y="354">요청 없음</text>
  <text class="t-s mid" x="284" y="373">유저 코드로 복귀</text>

  <!-- 오른쪽: 커널 선점 -->
  <rect class="panel warm" x="390" y="216" width="350" height="180" rx="14"/>
  <text class="t-b tc-warm" x="406" y="241">커널 모드였다 → 커널 선점</text>
  <rect class="box" x="406" y="252" width="318" height="58" rx="10"/>
  <text class="t-b" x="420" y="276">① 끊어도 되는가</text>
  <text class="t-code end" x="712" y="276">preempt_count == 0</text>
  <text class="t-b" x="420" y="298">② 끊어야 하는가</text>
  <text class="t-code end" x="712" y="298">need_resched()</text>
  <path class="ln" d="M500 310 V328" marker-end="url(#ah)"/>
  <path class="ln" d="M660 310 V328" marker-end="url(#ah)"/>
  <rect class="box green" x="406" y="332" width="190" height="52" rx="10"/>
  <text class="t-b mid" x="501" y="354">둘 다 참</text>
  <text class="t-code mid" x="501" y="373">preempt_schedule_irq()</text>
  <rect class="box gray" x="606" y="332" width="118" height="52" rx="10"/>
  <text class="t-b mid" x="665" y="354">하나라도 거짓</text>
  <text class="t-s mid" x="665" y="373">커널 코드로 복귀</text>
</svg>
