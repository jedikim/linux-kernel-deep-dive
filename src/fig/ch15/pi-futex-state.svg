<svg viewBox="0 0 760 404" xmlns="http://www.w3.org/2000/svg">
  <title>PI futex: 유저 공간의 32비트 워드에는 주인의 TID가 들어 있고, 경합이 생기면 커널이 그 워드에 rt_mutex를 품은 pi_state를 붙인다</title>

  <text class="t-h" x="20" y="30">PI futex의 워드</text>
  <text class="t-s" x="170" y="30">유저 공간 메모리에 있는 32비트 값</text>

  <text class="t-code mid tc-muted" x="85" y="62">31</text>
  <text class="t-code mid tc-muted" x="220" y="62">30</text>
  <text class="t-code mid tc-muted" x="515" y="62">29–0</text>

  <rect class="box red" x="20" y="70" width="130" height="48"/>
  <text class="t-mono t-b mid" x="85" y="99">WAITERS</text>
  <rect class="box gray" x="150" y="70" width="140" height="48"/>
  <text class="t-mono t-b mid" x="220" y="99">OWNER_DIED</text>
  <rect class="box blue" x="290" y="70" width="450" height="48"/>
  <text class="t-b mid" x="515" y="99">주인 스레드의 TID · 0이면 풀려 있다</text>

  <text class="t-xs mid" x="85" y="136">커널에 대기자가 있다</text>
  <text class="t-xs mid" x="220" y="136">주인이 쥔 채 죽었다</text>
  <text class="t-xs mid" x="515" y="136">잡기: cmpxchg(0 → 내 TID) · 풀기: cmpxchg(내 TID → 0)</text>

  <path class="ln thin muted" d="M20 154 H740"/>

  <text class="t-s t-ink t-b" x="20" y="180">스레드 L이 쥔 락을 스레드 H가 FUTEX_LOCK_PI로 기다릴 때</text>

  <rect class="box blue" x="20" y="196" width="200" height="64" rx="10"/>
  <text class="t-b" x="34" y="220">유저 워드</text>
  <text class="t-code" x="34" y="242">WAITERS | TID(L)</text>

  <rect class="box yellow" x="280" y="196" width="220" height="84" rx="10"/>
  <text class="t-mono t-b" x="294" y="220">futex_pi_state</text>
  <text class="t-code" x="294" y="242">pi_mutex (rt_mutex_base)</text>
  <text class="t-code" x="294" y="262">owner</text>

  <rect class="box blue" x="560" y="196" width="180" height="64" rx="10"/>
  <text class="t-b" x="574" y="220">스레드 L</text>
  <text class="t-xs" x="574" y="242">prio가 H의 값으로 오른다</text>

  <rect class="box purple" x="280" y="320" width="220" height="50" rx="10"/>
  <text class="t-b" x="294" y="342">스레드 H</text>
  <text class="t-xs" x="294" y="360">pi_mutex의 대기 트리에서 잠든다</text>

  <path class="ln" d="M220 228 H276" marker-end="url(#ah)"/>
  <text class="t-xs mid" x="248" y="218">키</text>
  <path class="ln yellow" d="M500 228 H556" marker-end="url(#ah-yellow)"/>
  <text class="t-xs mid" x="528" y="218">주인</text>
  <path class="ln purple" d="M390 320 V284" marker-end="url(#ah-purple)"/>
  <text class="t-xs tc-purple" x="400" y="306">rt_mutex_waiter</text>

  <text class="t-s mid" x="380" y="394">경합이 없는 동안에는 커널에 아무것도 없다. pi_state는 첫 대기자가 올 때 만들어진다</text>
</svg>
