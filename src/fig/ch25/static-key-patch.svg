<svg viewBox="0 0 760 348" xmlns="http://www.w3.org/2000/svg">
  <title>스태틱 키의 코드 패치: 키가 꺼져 있으면 분기 자리에 5바이트 NOP이 있어 그대로 지나가고, 키를 켜면 커널이 jump table을 보고 그 자리를 jmp 명령어로 고쳐 써서 드문 경로로 보낸다.</title>

  <!-- 꺼짐 -->
  <text class="t-b" x="20" y="28">키가 꺼져 있을 때</text>
  <rect class="box code" x="20" y="40" width="320" height="150" rx="10"/>
  <text class="t-code tc-muted" x="34" y="64">…</text>
  <rect class="box green" x="30" y="72" width="300" height="28" rx="5"/>
  <text class="t-code" x="40" y="91">0f 1f 44 00 00   nop</text>
  <text class="t-code" x="34" y="122">…  흔한 경로가 이어진다</text>
  <text class="t-code" x="34" y="142">ret</text>
  <text class="t-code tc-muted" x="34" y="170">l_yes:  드문 경로 (떨어져 있다)</text>

  <!-- 켜짐 -->
  <text class="t-b" x="420" y="28">키가 켜져 있을 때</text>
  <rect class="box code" x="420" y="40" width="320" height="150" rx="10"/>
  <text class="t-code tc-muted" x="434" y="64">…</text>
  <rect class="box warm" x="430" y="72" width="300" height="28" rx="5"/>
  <text class="t-code" x="440" y="91">e9 xx xx xx xx   jmp l_yes</text>
  <text class="t-code tc-muted" x="434" y="122">…  흔한 경로 (건너뛴다)</text>
  <text class="t-code tc-muted" x="434" y="142">ret</text>
  <text class="t-code" x="434" y="170">l_yes:  드문 경로</text>
  <path class="ln warm" d="M716 100 V166 H650" marker-end="url(#ah-warm)"/>

  <!-- 패치 -->
  <path class="ln" d="M340 86 H416" marker-end="url(#ah)"/>
  <text class="t-xs mid" x="380" y="78">고쳐 쓴다</text>

  <!-- jump table -->
  <rect class="box yellow" x="20" y="212" width="720" height="62" rx="10"/>
  <text class="t-b" x="34" y="236">__jump_table 섹션</text>
  <text class="t-xs" x="34" y="258">분기 자리마다 항목 하나</text>
  <rect class="box" x="250" y="224" width="150" height="38" rx="6"/>
  <text class="t-code mid" x="325" y="248">code: 이 자리의 주소</text>
  <rect class="box" x="410" y="224" width="150" height="38" rx="6"/>
  <text class="t-code mid" x="485" y="248">target: l_yes</text>
  <rect class="box" x="570" y="224" width="156" height="38" rx="6"/>
  <text class="t-code mid" x="648" y="248">key: 어느 키인가</text>
  <path class="ln thin muted dash" d="M380 212 V92"/>

  <text class="t-s" x="20" y="302">읽는 쪽은 변수를 읽지도 비교하지도 않는다. 꺼져 있을 때의 비용은 NOP 하나다</text>
  <text class="t-s" x="20" y="324">static_branch_enable()이 표에서 그 키의 항목을 모두 찾아 명령어를 바꾼다. 느린 작업이라 드물게 한다</text>
</svg>
