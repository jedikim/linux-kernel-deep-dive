<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <title>태스크의 CPU가 정해지는 두 자리: 깨울 때 넣을 런큐를 고르고, 부하 분산은 바쁜 런큐의 태스크를 한가한 런큐로 끌어온다.</title>

  <!-- 깨어난 태스크 -->
  <rect class="solid blue" x="20" y="116" width="100" height="44" rx="8"/>
  <text class="t-s t-b t-on mid" x="70" y="143">깨어난 태스크</text>
  <path class="ln blue" d="M120 138 H176" marker-end="url(#ah-blue)"/>
  <text class="t-s tc-blue t-b" x="20" y="100">① 깨울 때</text>

  <!-- CPU 0 -->
  <rect class="panel yellow" x="180" y="64" width="170" height="150" rx="12"/>
  <text class="t-b" x="194" y="88">CPU 0의 런큐</text>
  <rect class="solid green" x="194" y="100" width="64" height="24" rx="5"/>
  <text class="t-xs t-on mid" x="226" y="117">태스크</text>
  <rect class="ghost blue dash" x="194" y="130" width="64" height="24" rx="5"/>
  <text class="t-xs" x="194" y="200">여유가 있다</text>

  <!-- CPU 1 -->
  <rect class="panel yellow" x="370" y="64" width="170" height="150" rx="12"/>
  <text class="t-b" x="384" y="88">CPU 1의 런큐</text>
  <rect class="solid green" x="384" y="100" width="64" height="24" rx="5"/>
  <text class="t-xs t-on mid" x="416" y="117">태스크</text>
  <rect class="solid green" x="384" y="130" width="64" height="24" rx="5"/>
  <text class="t-xs t-on mid" x="416" y="147">태스크</text>
  <rect class="solid green" x="384" y="160" width="64" height="24" rx="5"/>
  <text class="t-xs t-on mid" x="416" y="177">태스크</text>
  <rect class="solid warm" x="462" y="100" width="64" height="24" rx="5"/>
  <text class="t-xs t-on mid" x="494" y="117">태스크</text>
  <text class="t-xs tc-red" x="384" y="204">쌓여 있다</text>

  <!-- CPU 2 -->
  <rect class="panel yellow" x="560" y="64" width="180" height="150" rx="12"/>
  <text class="t-b" x="574" y="88">CPU 2의 런큐</text>
  <rect class="ghost warm dash" x="574" y="100" width="64" height="24" rx="5"/>
  <text class="t-xs" x="574" y="200">비어 있다</text>

  <!-- 부하 분산 -->
  <path class="ln warm" d="M526 112 H570" marker-end="url(#ah-warm)"/>
  <text class="t-s tc-warm t-b mid" x="550" y="50">② 부하 분산</text>

  <text class="t-s t-ink" x="20" y="250">① 넣을 런큐를 고른다. 아직 어느 큐에도 없으므로 옮기는 비용이 없다. 가장 자주 일어난다</text>
  <text class="t-s t-ink" x="20" y="274">② 이미 들어 있는 태스크를 끌어온다. 놀던 CPU를 쓰는 대신 따뜻한 캐시를 버린다</text>
</svg>
