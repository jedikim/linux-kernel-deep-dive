<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg">
  <title>mmap_lock만 있을 때와 per-VMA 락이 있을 때의 비교: 한 스레드가 mmap()으로 쓰기 락을 쥔 동안 다른 스레드의 페이지 폴트가 기다리는지 여부</title>

  <!-- 위: mmap_lock만 -->
  <text class="t-b" x="20" y="26">mmap_lock만 있을 때</text>
  <rect class="box red" x="560" y="14" width="26" height="14" rx="3"/>
  <rect x="560" y="14" width="26" height="14" rx="3" fill="url(#hatch-red)"/>
  <text class="t-xs" x="594" y="26">락을 기다리는 시간</text>

  <text class="t-s t-ink t-b" x="20" y="60">T1</text>
  <rect class="box warm" x="200" y="40" width="300" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="350" y="60">mmap() · mmap_lock을 쓰기로 쥔다</text>

  <text class="t-s t-ink t-b" x="20" y="98">T2</text>
  <text class="t-xs end" x="244" y="98">VMA A에서 폴트</text>
  <rect class="box red" x="250" y="78" width="250" height="30" rx="6"/>
  <rect x="250" y="78" width="250" height="30" rx="6" fill="url(#hatch-red)"/>
  <rect class="box green" x="500" y="78" width="120" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="560" y="98">폴트 처리</text>

  <text class="t-s t-ink t-b" x="20" y="136">T3</text>
  <text class="t-xs end" x="314" y="136">VMA B에서 폴트</text>
  <rect class="box red" x="320" y="116" width="180" height="30" rx="6"/>
  <rect x="320" y="116" width="180" height="30" rx="6" fill="url(#hatch-red)"/>
  <rect class="box green" x="500" y="116" width="120" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="560" y="136">폴트 처리</text>

  <text class="t-s tc-red mid" x="380" y="168">T1이 쓰기 락을 쥔 동안, 관계없는 VMA의 폴트까지 모두 읽기 락을 기다린다</text>

  <path class="ln thin muted dash" d="M20 186 H740"/>

  <!-- 아래: per-VMA 락 -->
  <text class="t-b" x="20" y="214">per-VMA 락이 있을 때</text>

  <text class="t-s t-ink t-b" x="20" y="248">T1</text>
  <rect class="box warm" x="200" y="228" width="300" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="350" y="248">mmap() · 쓰기 락 + 고치는 VMA만 잠금</text>

  <text class="t-s t-ink t-b" x="20" y="286">T2</text>
  <text class="t-xs end" x="244" y="286">VMA A에서 폴트</text>
  <rect class="box green" x="250" y="266" width="170" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="335" y="286">A를 읽기로 잠금 · 처리</text>

  <text class="t-s t-ink t-b" x="20" y="324">T3</text>
  <text class="t-xs end" x="314" y="324">VMA B에서 폴트</text>
  <rect class="box green" x="320" y="304" width="170" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="405" y="324">B를 읽기로 잠금 · 처리</text>

  <text class="t-s mid" x="380" y="358">폴트는 RCU로 VMA를 찾아 그 VMA의 vm_refcnt만 올린다. mmap_lock은 건드리지 않는다</text>
</svg>
