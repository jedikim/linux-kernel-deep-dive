<svg viewBox="0 0 760 352" xmlns="http://www.w3.org/2000/svg">
  <title>KPTI의 두 PGD: 유저 모드용에는 유저 매핑과 cpu_entry_area만 있고, 커널 모드용에는 유저 매핑과 커널 매핑이 모두 있다. 커널을 드나들 때 CR3를 바꾼다.</title>

  <!-- 유저 모드용 -->
  <rect class="panel blue" x="20" y="16" width="300" height="250" rx="14"/>
  <text class="t-b tc-blue" x="36" y="42">유저 모드에서 쓰는 PGD</text>
  <text class="t-xs" x="36" y="62">위쪽 절반 · 커널 주소</text>
  <rect class="ghost dash" x="36" y="70" width="268" height="78" rx="8"/>
  <rect class="box yellow" x="48" y="80" width="244" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="170" y="100">cpu_entry_area · 진입 코드와 스택</text>
  <text class="t-xs mid" x="170" y="134">그 밖의 커널 매핑은 없다</text>
  <text class="t-xs" x="36" y="168">아래쪽 절반 · 유저 주소</text>
  <rect class="box blue" x="36" y="176" width="268" height="74" rx="8"/>
  <text class="t-b mid" x="170" y="208">유저 매핑 전체</text>
  <text class="t-s mid" x="170" y="230">코드, 힙, 스택, 라이브러리</text>

  <!-- 커널 모드용 -->
  <rect class="panel yellow" x="440" y="16" width="300" height="250" rx="14"/>
  <text class="t-b tc-yellow" x="456" y="42">커널 모드에서 쓰는 PGD</text>
  <text class="t-xs" x="456" y="62">위쪽 절반 · 커널 주소</text>
  <rect class="box yellow" x="456" y="70" width="268" height="78" rx="8"/>
  <text class="t-b mid" x="590" y="104">커널 매핑 전체</text>
  <text class="t-s mid" x="590" y="126">직접 매핑, vmalloc, 텍스트, 모듈</text>
  <text class="t-xs" x="456" y="168">아래쪽 절반 · 유저 주소</text>
  <rect class="box blue" x="456" y="176" width="268" height="74" rx="8"/>
  <text class="t-b mid" x="590" y="202">유저 매핑 전체</text>
  <text class="t-s mid" x="590" y="222">copy_to_user()가 이 매핑으로 쓴다</text>
  <text class="t-xs mid" x="590" y="240">PGD 항목에 NX · 실행은 못 한다</text>

  <!-- CR3 전환 -->
  <text class="t-xs mid" x="380" y="92">커널 진입</text>
  <path class="ln" d="M326 104 H430" marker-end="url(#ah)"/>
  <text class="t-code mid" x="380" y="124">CR3 교체</text>
  <text class="t-xs mid" x="380" y="186">유저 복귀</text>
  <path class="ln" d="M434 198 H330" marker-end="url(#ah)"/>
  <text class="t-code mid" x="380" y="218">CR3 교체</text>

  <!-- 공유하는 아래 단계 -->
  <path class="ln thin blue" d="M170 250 V288" marker-end="url(#ah-blue)"/>
  <path class="ln thin blue" d="M590 250 V288" marker-end="url(#ah-blue)"/>
  <rect class="box" x="110" y="292" width="540" height="46" rx="10"/>
  <text class="t-s t-ink t-b mid" x="380" y="312">유저 주소의 아래 단계 표(PUD, PMD, PTE)는 한 벌이다</text>
  <text class="t-xs mid" x="380" y="329">두 PGD의 항목이 같은 표를 가리키므로 PTE를 고칠 때 한 곳만 고치면 된다</text>
</svg>
