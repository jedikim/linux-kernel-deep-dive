<svg viewBox="0 0 760 384" xmlns="http://www.w3.org/2000/svg">
  <title>장치 레지스터가 놓이는 두 주소 공간: in, out 명령어로 접근하는 64KB 포트 I/O 공간과, RAM과 같은 주소 체계를 쓰는 메모리 맵 I/O. PCI 장치의 BAR 영역 안에 장치 레지스터가 있다</title>

  <!-- 포트 I/O -->
  <rect class="panel" x="20" y="16" width="270" height="300" rx="12"/>
  <text class="t-b" x="34" y="40">포트 I/O 공간</text>
  <text class="t-xs" x="34" y="60">주소 16비트 · in, out 명령어</text>
  <rect class="box gray" x="34" y="74" width="242" height="28"/>
  <text class="t-code" x="44" y="93">0x20–0x21</text>
  <text class="t-xs" x="150" y="93">첫째 PIC</text>
  <rect class="box gray" x="34" y="102" width="242" height="28"/>
  <text class="t-code" x="44" y="121">0x40–0x43</text>
  <text class="t-xs" x="150" y="121">PIT 타이머</text>
  <rect class="box gray" x="34" y="130" width="242" height="28"/>
  <text class="t-code" x="44" y="149">0x60, 0x64</text>
  <text class="t-xs" x="150" y="149">키보드 컨트롤러</text>
  <rect class="box gray" x="34" y="158" width="242" height="28"/>
  <text class="t-code" x="44" y="177">0xa0–0xa1</text>
  <text class="t-xs" x="150" y="177">둘째 PIC</text>
  <rect class="box gray" x="34" y="186" width="242" height="28"/>
  <text class="t-code" x="44" y="205">0x3f8–0x3ff</text>
  <text class="t-xs" x="150" y="205">직렬 포트</text>
  <rect class="box gray" x="34" y="214" width="242" height="28"/>
  <text class="t-code" x="44" y="233">0xcf8–0xcff</text>
  <text class="t-xs" x="150" y="233">PCI 설정 공간 접근</text>
  <text class="t-xs" x="34" y="272">커널에서는</text>
  <text class="t-code" x="34" y="294">inb(port) · outb(value, port)</text>

  <!-- MMIO -->
  <rect class="panel" x="310" y="16" width="430" height="300" rx="12"/>
  <text class="t-b" x="324" y="40">물리 주소 공간 (메모리 맵 I/O)</text>
  <text class="t-xs" x="324" y="60">RAM과 같은 주소 체계 · 보통의 mov 명령어</text>

  <rect class="box blue" x="324" y="74" width="190" height="30"/>
  <text class="t-xs t-ink mid" x="419" y="94">RAM (4GB 위)</text>
  <rect class="box warm" x="324" y="104" width="190" height="30"/>
  <text class="t-code" x="334" y="124">0xfee00000</text>
  <text class="t-xs" x="424" y="124">Local APIC</text>
  <rect class="box warm" x="324" y="134" width="190" height="30"/>
  <text class="t-code" x="334" y="154">0xfec00000</text>
  <text class="t-xs" x="424" y="154">IO-APIC</text>
  <rect class="box green" x="324" y="164" width="190" height="46"/>
  <text class="t-xs t-ink t-b mid" x="419" y="184">PCI 장치의 BAR 영역</text>
  <text class="t-xs mid" x="419" y="202">장치마다 한 덩이씩</text>
  <rect class="box blue" x="324" y="210" width="190" height="60"/>
  <text class="t-xs t-ink mid" x="419" y="245">RAM</text>
  <text class="t-code" x="324" y="290">0x00000000</text>

  <path class="ln thin green dash" d="M514 164 L540 96 M514 210 L540 246"/>
  <rect class="box green" x="540" y="96" width="188" height="150" rx="10"/>
  <text class="t-s t-ink t-b" x="552" y="118">e1000e · BAR 0</text>
  <text class="t-code" x="552" y="142">0x0000 CTRL</text>
  <text class="t-xs" x="664" y="142">제어</text>
  <text class="t-code" x="552" y="162">0x0008 STATUS</text>
  <text class="t-xs" x="664" y="162">상태</text>
  <text class="t-code" x="552" y="182">0x00c0 ICR</text>
  <text class="t-xs" x="664" y="182">원인</text>
  <text class="t-code" x="552" y="202">0x00d0 IMS</text>
  <text class="t-xs" x="664" y="202">마스크</text>
  <text class="t-code" x="552" y="232">readl(hw_addr + reg)</text>

  <text class="t-s" x="20" y="344">어느 쪽이든 주소 뒤에 있는 것은 저장 공간이 아니라 장치다. 읽기만 해도 장치의 상태가 바뀔 수 있다.</text>
  <text class="t-s" x="20" y="366">커널은 MMIO 영역을 ioremap()으로 매핑한 뒤 readl(), writel() 같은 접근 함수로만 건드린다.</text>
</svg>
