<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg">
  <title>seqcount의 읽기 재시도: 읽는 도중에 sequence 값이 바뀌면 읽은 값을 버리고 다시 읽는다</title>

  <text class="t-s t-ink t-b" x="20" y="60">sequence</text>
  <rect class="box gray" x="160" y="40" width="180" height="30"/>
  <text class="t-s t-ink mid" x="250" y="60">4 · 짝수</text>
  <rect class="box warm" x="340" y="40" width="180" height="30"/>
  <text class="t-s t-ink mid" x="430" y="60">5 · 홀수 = 쓰는 중</text>
  <rect class="box gray" x="520" y="40" width="220" height="30"/>
  <text class="t-s t-ink mid" x="630" y="60">6 · 짝수</text>

  <text class="t-s t-ink t-b" x="20" y="104">쓰는 쪽</text>
  <rect class="box warm" x="340" y="84" width="180" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="430" y="104">값을 고친다</text>
  <text class="t-xs tc-warm end" x="334" y="104">sequence++ →</text>
  <text class="t-xs tc-warm" x="526" y="104">← sequence++</text>

  <path class="ln thin muted dash" d="M340 24 V174"/>
  <path class="ln thin muted dash" d="M520 24 V174"/>
  <path class="ln thin muted dash" d="M340 202 V244"/>
  <path class="ln thin muted dash" d="M520 202 V244"/>

  <text class="t-s t-ink t-b" x="20" y="160">읽는 쪽 A</text>
  <rect class="box green" x="190" y="140" width="120" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="250" y="160">읽기</text>
  <text class="t-xs" x="160" y="188">시작할 때 4, 끝날 때 4. 읽은 값을 그대로 쓴다</text>

  <text class="t-s t-ink t-b" x="20" y="230">읽는 쪽 B</text>
  <rect class="box red" x="270" y="210" width="150" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="345" y="230">읽기 → 버림</text>
  <rect class="box red" x="420" y="210" width="100" height="30" rx="6"/>
  <rect x="420" y="210" width="100" height="30" rx="6" fill="url(#hatch-red)"/>
  <rect class="box green" x="520" y="210" width="120" height="30" rx="6"/>
  <text class="t-s t-ink mid" x="580" y="230">다시 읽기</text>
  <text class="t-xs" x="160" y="258">시작할 때 4, 끝날 때 5. 값을 버리고, 짝수가 될 때까지 돌다가 다시 읽는다</text>

  <text class="t-s mid" x="380" y="298">쓰는 쪽은 읽는 쪽을 기다리지 않는다. 읽는 쪽은 공유 메모리에 아무것도 쓰지 않는다</text>
</svg>
