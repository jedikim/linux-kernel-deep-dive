  <path class="ln thin" d="M138 125 H197" marker-end="url(#ah)"/>
  <path class="ln thin" d="M282 125 H341" marker-end="url(#ah)"/>
  <path class="ln thin" d="M426 125 H485" marker-end="url(#ah)"/>
  <path class="ln thin" d="M570 125 H629" marker-end="url(#ah)"/>
  <text class="t-xs" x="20" y="200">private이 잠든</text>
  <text class="t-xs" x="20" y="216">태스크를 가리킨다</text>

  <rect class="box code" x="20" y="262" width="720" height="62" rx="8"/>
  <text class="t-mono t-b" x="34" y="285">wake_up(&amp;wq)</text>
  <text class="t-s" x="190" y="285">앞에서부터 func를 부른다. 배타 대기자를 하나 깨우면 거기서 멈춘다 (A, B, C)</text>
  <text class="t-mono t-b" x="34" y="309">wake_up_all(&amp;wq)</text>
  <text class="t-s" x="190" y="309">끝까지 간다 (A, B, C, D)</text>
</svg>
