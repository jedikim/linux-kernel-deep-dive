<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg">
  <title>bio 하나는 bio_vec 배열로 흩어진 메모리 조각들을 가리키고, bi_iter로 장치의 연속된 섹터 구간을 가리킨다. 섹터가 이어지는 bio는 request 하나로 병합된다</title>

  <rect class="box yellow" x="20" y="20" width="200" height="140" rx="10"/>
  <text class="t-mono t-b" x="32" y="42">struct bio</text>
  <text class="t-code" x="32" y="66">bi_bdev</text>
  <text class="t-code" x="32" y="86">bi_iter.bi_sector</text>
  <text class="t-code" x="32" y="106">bi_iter.bi_size</text>
  <text class="t-code" x="32" y="126">bi_io_vec</text>
  <text class="t-code" x="32" y="146">bi_end_io</text>

  <path class="ln yellow" d="M220 122 H266" marker-end="url(#ah-yellow)"/>
  <rect class="panel yellow" x="270" y="40" width="170" height="132" rx="10"/>
  <text class="t-mono t-b" x="282" y="60">bio_vec[]</text>
  <rect class="box" x="280" y="70" width="150" height="28"/>
  <text class="t-code mid" x="355" y="89">len=16384 off=0</text>
  <rect class="box" x="280" y="102" width="150" height="28"/>
  <text class="t-code mid" x="355" y="121">len=4096 off=0</text>
  <rect class="box" x="280" y="134" width="150" height="28"/>
  <text class="t-code mid" x="355" y="153">len=8192 off=0</text>

  <text class="t-s t-ink t-b" x="500" y="52">메모리: 흩어져 있어도 된다</text>
  <path class="ln green" d="M430 84 H496" marker-end="url(#ah-green)"/>
  <rect class="box green" x="500" y="71" width="220" height="26" rx="4"/>
  <text class="t-xs t-ink mid" x="610" y="89">폴리오 16KB</text>
  <path class="ln green" d="M430 116 H596" marker-end="url(#ah-green)"/>
  <rect class="box green" x="600" y="103" width="70" height="26" rx="4"/>
  <text class="t-xs t-ink mid" x="635" y="121">4KB</text>
  <path class="ln green" d="M430 148 H526" marker-end="url(#ah-green)"/>
  <rect class="box green" x="530" y="135" width="130" height="26" rx="4"/>
  <text class="t-xs t-ink mid" x="595" y="153">폴리오 8KB</text>

  <!-- 장치 -->
  <path class="ln yellow" d="M120 160 V222" marker-end="url(#ah-yellow)"/>
  <text class="t-xs" x="130" y="198">bi_sector부터 bi_size만큼</text>
  <text class="t-s t-ink t-b end" x="740" y="214">장치: 연속된 섹터여야 한다</text>
  <rect class="box gray" x="20" y="226" width="720" height="30"/>
  <rect class="box yellow" x="120" y="226" width="196" height="30"/>
  <text class="t-xs t-ink mid" x="218" y="246">이 bio · 28KB</text>
  <rect class="box blue" x="316" y="226" width="112" height="30"/>
  <text class="t-xs t-ink mid" x="372" y="246">다음 bio</text>
  <path class="ln thin" d="M120 266 H428"/>
  <text class="t-xs mid" x="274" y="284">섹터가 이어지는 bio 둘 → request 하나로 병합</text>
</svg>
