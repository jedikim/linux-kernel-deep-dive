<svg viewBox="0 0 760 352" xmlns="http://www.w3.org/2000/svg">
  <title>io_uring의 두 링과 네 인덱스: 제출 큐는 유저가 tail을, 커널이 head를 쓰고, 완료 큐는 커널이 tail을, 유저가 head를 쓴다</title>

  <rect class="box blue" x="20" y="14" width="720" height="44" rx="10"/>
  <text class="t-b" x="36" y="41">유저 프로그램</text>
  <text class="t-s end" x="724" y="41">SQE를 채우고 SQ tail을 올린다 · CQE를 읽고 CQ head를 올린다</text>

  <rect class="panel green" x="20" y="88" width="720" height="150" rx="14"/>
  <text class="t-b" x="44" y="114">제출 큐 (SQ)</text>
  <text class="t-xs" x="140" y="114">유저 → 커널</text>
  <text class="t-b" x="470" y="114">완료 큐 (CQ)</text>
  <text class="t-xs" x="568" y="114">커널 → 유저</text>
  <rect class="ghost dash" x="44" y="128" width="44" height="40"/>
  <rect class="box blue" x="92" y="128" width="44" height="40"/>
  <text class="t-xs t-ink mid" x="114" y="153">SQE</text>
  <rect class="box blue" x="140" y="128" width="44" height="40"/>
  <text class="t-xs t-ink mid" x="162" y="153">SQE</text>
  <rect class="box blue" x="188" y="128" width="44" height="40"/>
  <text class="t-xs t-ink mid" x="210" y="153">SQE</text>
  <rect class="ghost dash" x="236" y="128" width="44" height="40"/>
  <rect class="ghost dash" x="284" y="128" width="44" height="40"/>
  <rect class="box yellow" x="432" y="128" width="44" height="40"/>
  <text class="t-xs t-ink mid" x="454" y="153">CQE</text>
  <rect class="box yellow" x="480" y="128" width="44" height="40"/>
  <text class="t-xs t-ink mid" x="502" y="153">CQE</text>
  <rect class="ghost dash" x="528" y="128" width="44" height="40"/>
  <rect class="ghost dash" x="576" y="128" width="44" height="40"/>
  <rect class="ghost dash" x="624" y="128" width="44" height="40"/>
  <rect class="ghost dash" x="672" y="128" width="44" height="40"/>

  <!-- 유저가 쓰는 인덱스 -->
  <path class="ln blue" d="M258 58 V124" marker-end="url(#ah-blue)"/>
  <text class="t-code tc-blue" x="266" y="80">tail</text>
  <path class="ln blue" d="M454 58 V124" marker-end="url(#ah-blue)"/>
  <text class="t-code tc-blue" x="462" y="80">head</text>
  <!-- 커널이 쓰는 인덱스 -->
  <path class="ln yellow" d="M114 268 V172" marker-end="url(#ah-yellow)"/>
  <text class="t-code" x="122" y="196">head</text>
  <text class="t-xs" x="122" y="214">커널이 여기까지 가져갔다</text>
  <path class="ln yellow" d="M550 268 V172" marker-end="url(#ah-yellow)"/>
  <text class="t-code" x="558" y="196">tail</text>
  <text class="t-xs" x="558" y="214">커널이 여기까지 썼다</text>

  <rect class="box yellow" x="20" y="268" width="720" height="44" rx="10"/>
  <text class="t-b" x="36" y="295">커널</text>
  <text class="t-s end" x="724" y="295">SQE를 읽고 SQ head를 올린다 · CQE를 쓰고 CQ tail을 올린다</text>

  <text class="t-s mid" x="380" y="338">넣는 쪽은 tail만, 꺼내는 쪽은 head만 쓴다. tail − head가 들어 있는 개수다</text>
</svg>
