<svg viewBox="0 0 760 404" xmlns="http://www.w3.org/2000/svg">
  <title>스케줄링 정책 일곱 개와 스케줄링 클래스 여섯 개의 대응: SCHED_DEADLINE은 deadline, SCHED_FIFO와 SCHED_RR은 rt, SCHED_NORMAL·BATCH·IDLE은 fair, SCHED_EXT는 ext 클래스로 간다. stop과 idle 클래스는 유저 공간에서 고를 수 없다.</title>

  <text class="t-s t-ink t-b" x="20" y="26">유저 공간이 고르는 정책</text>
  <text class="t-s t-ink t-b end" x="740" y="26">커널 안의 클래스 (높은 순)</text>

  <!-- 클래스 -->
  <rect class="box gray" x="540" y="38" width="200" height="38" rx="8"/>
  <text class="t-b" x="554" y="62">stop</text>
  <text class="t-code end" x="728" y="62">stop_sched_class</text>
  <text class="t-xs end" x="528" y="62">유저 공간에서 고를 수 없다 · migration/N</text>

  <rect class="box warm" x="540" y="84" width="200" height="38" rx="8"/>
  <text class="t-b" x="554" y="108">deadline</text>
  <text class="t-code end" x="728" y="108">dl_sched_class</text>

  <rect class="box warm" x="540" y="141" width="200" height="38" rx="8"/>
  <text class="t-b" x="554" y="165">rt</text>
  <text class="t-code end" x="728" y="165">rt_sched_class</text>

  <rect class="box green" x="540" y="236" width="200" height="38" rx="8"/>
  <text class="t-b" x="554" y="260">fair</text>
  <text class="t-code end" x="728" y="260">fair_sched_class</text>

  <rect class="box teal" x="540" y="312" width="200" height="38" rx="8"/>
  <text class="t-b" x="554" y="336">ext</text>
  <text class="t-code end" x="728" y="336">ext_sched_class</text>

  <rect class="box gray" x="540" y="358" width="200" height="38" rx="8"/>
  <text class="t-b" x="554" y="382">idle</text>
  <text class="t-code end" x="728" y="382">idle_sched_class</text>
  <text class="t-xs end" x="528" y="382">유저 공간에서 고를 수 없다 · swapper/N</text>

  <!-- 정책 -->
  <rect class="box blue" x="20" y="88" width="200" height="30" rx="6"/>
  <text class="t-mono" x="32" y="108">SCHED_DEADLINE</text>
  <text class="t-code tc-muted end" x="210" y="108">6</text>

  <rect class="box blue" x="20" y="126" width="200" height="30" rx="6"/>
  <text class="t-mono" x="32" y="146">SCHED_FIFO</text>
  <text class="t-code tc-muted end" x="210" y="146">1</text>

  <rect class="box blue" x="20" y="164" width="200" height="30" rx="6"/>
  <text class="t-mono" x="32" y="184">SCHED_RR</text>
  <text class="t-code tc-muted end" x="210" y="184">2</text>

  <rect class="box blue" x="20" y="202" width="200" height="30" rx="6"/>
  <text class="t-mono" x="32" y="222">SCHED_NORMAL</text>
  <text class="t-code tc-muted end" x="210" y="222">0</text>

  <rect class="box blue" x="20" y="240" width="200" height="30" rx="6"/>
  <text class="t-mono" x="32" y="260">SCHED_BATCH</text>
  <text class="t-code tc-muted end" x="210" y="260">3</text>

  <rect class="box blue" x="20" y="278" width="200" height="30" rx="6"/>
  <text class="t-mono" x="32" y="298">SCHED_IDLE</text>
  <text class="t-code tc-muted end" x="210" y="298">5</text>

  <rect class="box blue" x="20" y="316" width="200" height="30" rx="6"/>
  <text class="t-mono" x="32" y="336">SCHED_EXT</text>
  <text class="t-code tc-muted end" x="210" y="336">7</text>

  <!-- 대응 -->
  <path class="ln warm" d="M220 103 H536" marker-end="url(#ah-warm)"/>
  <path class="ln warm" d="M220 141 H300 V160 H536" marker-end="url(#ah-warm)"/>
  <path class="ln warm" d="M220 179 H300 V160"/>
  <path class="ln green" d="M220 217 H300 V255 H536" marker-end="url(#ah-green)"/>
  <path class="ln green" d="M220 255 H300"/>
  <path class="ln green" d="M220 293 H300 V255"/>
  <path class="ln teal" d="M220 331 H536" marker-end="url(#ah-teal)"/>
  <path class="ln thin teal dash" d="M400 331 V268" marker-end="url(#ah-teal)"/>
  <text class="t-xs" x="408" y="296">BPF 스케줄러가</text>
  <text class="t-xs" x="408" y="312">없으면 fair로</text>

  <text class="t-code" x="312" y="96">dl_prio(prio)</text>
  <text class="t-code" x="312" y="153">rt_prio(prio)</text>
  <text class="t-s t-ink" x="312" y="248">그 밖의 모든 태스크</text>
</svg>
