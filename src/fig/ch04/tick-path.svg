<svg viewBox="0 0 760 372" xmlns="http://www.w3.org/2000/svg">
  <title>타이머 인터럽트에서 sched_tick을 거쳐 클래스별 task_tick까지의 경로. 틱은 재스케줄 요청 플래그만 세우고 실제 전환은 인터럽트 복귀 길에 일어난다.</title>

  <rect class="box gray" x="20" y="16" width="280" height="44" rx="10"/>
  <use href="#i-clock" x="32" y="24" width="28" height="28" class="ic gray"/>
  <text class="t-b" x="70" y="43">타이머 인터럽트</text>
  <text class="t-xs end" x="288" y="43">초당 HZ번</text>
  <path class="ln" d="M160 60 V76" marker-end="url(#ah)"/>

  <rect class="box yellow" x="20" y="80" width="280" height="58" rx="10"/>
  <text class="t-code" x="34" y="103">tick_nohz_handler()</text>
  <text class="t-code" x="34" y="124">→ update_process_times()</text>
  <text class="t-xs end" x="288" y="103">kernel/time · 8장</text>
  <path class="ln" d="M160 138 V154" marker-end="url(#ah)"/>

  <rect class="box yellow" x="20" y="158" width="280" height="134" rx="10"/>
  <text class="t-mono t-b" x="34" y="182">sched_tick()</text>
  <text class="t-code" x="34" y="206">rq_lock(rq)</text>
  <text class="t-code" x="34" y="225">update_rq_clock(rq)</text>
  <text class="t-code t-b" x="34" y="244">donor->sched_class->task_tick()</text>
  <text class="t-code" x="34" y="263">sched_balance_trigger(rq)</text>
  <text class="t-xs" x="34" y="282">인터럽트 컨텍스트 · 인터럽트 꺼짐</text>

  <!-- 클래스로 갈라짐 -->
  <path class="ln" d="M300 240 H336" marker-end="url(#ah)"/>
  <path class="ln" d="M320 240 V103 H336" marker-end="url(#ah)"/>
  <path class="ln" d="M320 173 H336" marker-end="url(#ah)"/>
  <path class="ln" d="M320 240 V289 H336" marker-end="url(#ah)"/>

  <rect class="box green" x="340" y="72" width="400" height="62" rx="10"/>
  <text class="t-b" x="354" y="96">fair</text>
  <text class="t-code end" x="728" y="96">task_tick_fair() → update_curr()</text>
  <text class="t-s" x="354" y="120">실행 시간을 더하고, 몫을 다 썼으면 플래그를 세운다</text>

  <rect class="box warm" x="340" y="142" width="400" height="62" rx="10"/>
  <text class="t-b" x="354" y="166">rt</text>
  <text class="t-code end" x="728" y="166">task_tick_rt()</text>
  <text class="t-s" x="354" y="190">SCHED_RR만 타임 슬라이스를 깎는다. 0이 되면 플래그</text>

  <rect class="box warm" x="340" y="217" width="400" height="46" rx="10"/>
  <text class="t-b" x="354" y="245">deadline</text>
  <text class="t-code end" x="728" y="245">task_tick_dl() → update_curr_dl()</text>

  <rect class="box gray" x="340" y="273" width="400" height="32" rx="10"/>
  <text class="t-b" x="354" y="294">stop · idle</text>
  <text class="t-s end" x="728" y="294">장부만 갱신하거나 하는 일이 없다</text>

  <!-- 결과 -->
  <path class="ln red" d="M160 292 V326" marker-end="url(#ah-red)"/>
  <rect class="box red" x="20" y="330" width="720" height="34" rx="10"/>
  <text class="t-s t-ink mid" x="380" y="352">틱은 재스케줄 요청 플래그만 세운다. 전환은 인터럽트에서 돌아가는 길에 __schedule()이 한다 (6장)</text>
</svg>
